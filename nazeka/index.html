<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>なぜか、走ってくる</title>
<style>
/* なぜか、走ってくる: 画面いっぱいの 3D。その上に、ふちの暗がり・字・ボタンを重ねる。タッチ端末では下に、移動の棒とボタン。 */
/* 見た目は 1 種類だけ（夜）。明暗テーマでは変えない。 */
:root{
  --bg:#05070c; --ink:#e6e2d8; --dim:#9a968c; --amber:#e8a838; --blood:#7a0c0c;
  --glass:rgba(8,10,16,.72); --line:rgba(230,226,216,.28); --pad:rgba(20,22,30,.55); --pad-on:rgba(90,94,110,.6);
  --font:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --ui:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.6 var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;margin:0;border:0;padding:0;background:none;cursor:pointer}
[hidden]{display:none!important}
.app{position:relative;height:100%;overflow:hidden;background:var(--bg)}
.cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.fx{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
.vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(0,0,0,.82) 100%);opacity:.55}
.red{background:var(--blood);opacity:0;transition:opacity .25s}
.black{background:#000;opacity:0;transition:opacity .5s}
.bars i{position:absolute;left:0;right:0;height:0;background:#000;transition:height .45s}
.bars i:first-child{top:0}.bars i:last-child{bottom:0}
.bars.on i{height:11%}

/* 画面の上の表示。左右は、端末のふちをよける */
.hud{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.day{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;color:var(--dim);letter-spacing:.12em}
.pause{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:8px;width:40px;height:40px;color:var(--dim);pointer-events:auto;border-radius:6px}
.pause:focus-visible,.btn:focus-visible,.pbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.home{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;line-height:1.15;color:var(--amber);text-shadow:0 1px 3px #000;will-change:transform}
.home b{font-weight:600;font-size:13px;border:1px solid var(--amber);padding:1px 6px;border-radius:3px;background:rgba(0,0,0,.35)}
.home span{font-size:12px;font-variant-numeric:tabular-nums}
.msg{position:absolute;left:16px;right:16px;bottom:23%;text-align:center;font:17px/1.5 var(--font);text-shadow:0 1px 4px #000,0 0 12px #000;min-height:1.5em}
.prompt{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--amber);text-shadow:0 1px 4px #000;white-space:nowrap}
.pbar{width:150px;height:5px;background:rgba(0,0,0,.6);box-shadow:0 0 0 1px var(--line)}
.pbar i{display:block;height:100%;width:0;background:var(--amber)}
.stam{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(180px,40%);height:4px;background:rgba(0,0,0,.55);box-shadow:0 0 0 1px var(--line)}
.stam::before{content:"息";position:absolute;right:100%;top:50%;transform:translateY(-50%);margin-right:8px;font-size:12px;line-height:1;color:var(--dim);text-shadow:0 1px 3px #000}
.stam i{display:block;height:100%;width:100%;background:var(--ink)}
.stam i.low{background:var(--dim)}

/* 題と、結果の札 */
.panel{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:flex-start;gap:14px;
  padding-block:24px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));
  background:linear-gradient(90deg,rgba(4,6,10,.9) 0,rgba(4,6,10,.62) 46%,rgba(4,6,10,.12) 100%);overflow:auto}
/* 中身は上下の中央に。入りきらないときは、上から並べて、巻いて読めるようにする */
.panel::before,.panel::after{content:"";flex:1 0 0}
.panel p,.msg{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
.panel h1{margin:0;font:600 clamp(30px,min(7.5vw,12vh),62px)/1.18 var(--font);letter-spacing:.04em;text-wrap:balance}
.panel .sub{margin:0;max-width:30em;color:var(--ink);font:16px/1.75 var(--font)}
.panel .help{margin:0;max-width:34em;color:var(--dim);font-size:13px;line-height:1.7}
.panel .note{margin:0;color:var(--dim);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row.col{flex-direction:column;align-items:stretch;min-width:min(260px,80%)}
.btn{min-height:42px;padding:6px 18px;border:1px solid var(--line);border-radius:4px;background:var(--glass);text-align:center}
.btn:hover{border-color:var(--ink)}
.btn.big{min-width:190px;font:600 18px/1.4 var(--font);border-color:var(--amber);color:var(--amber)}
.card{align-items:center;text-align:center;background:rgba(0,0,0,.78)}
.lines p{margin:0 0 8px;font:19px/1.6 var(--font)}
.lines p:first-child{font-size:clamp(24px,5vw,34px);margin-bottom:14px}
.lines p:last-child{color:var(--dim);font-size:15px}

/* 移動の棒とボタン（タッチ端末）*/
.pad{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(18px,env(safe-area-inset-right,0px)) max(30px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.stick{position:relative;width:140px;height:140px;border-radius:50%;background:var(--pad);box-shadow:inset 0 0 0 1px var(--line);pointer-events:auto;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--pad-on);pointer-events:none}
.btns{display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:auto}
.pbtn{min-width:92px;height:64px;padding:0 14px;border-radius:32px;background:var(--pad);box-shadow:inset 0 0 0 1px var(--line);touch-action:none}
.pbtn.on{background:var(--pad-on)}
/* 幅の狭い画面（縦持ちのスマホ）では、字が道の明るいところに重なるので、全体を暗くする */
@media (max-width:600px){.panel{background:rgba(4,6,10,.7)}.card{background:rgba(0,0,0,.78)}}
/* 背の低い画面（横持ちのスマホ）では、詰めて並べる */
@media (max-height:480px){
  .panel{gap:8px;padding-block:10px}
  .panel h1{font-size:32px}
  .panel h1 br{display:none}
  .panel .sub{font-size:14px;line-height:1.6}
  .panel .help{font-size:12px;line-height:1.55}
  .btn{min-height:38px}
  .lines p{margin-bottom:4px}
  .lines p:first-child{margin-bottom:8px}
  .stick{width:124px;height:124px}
  .pbtn{height:54px}
  .btns{gap:8px}
  .pad{padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.red,.black,.bars i{transition:none}}

</style>
</head>
<body>
<div id="app" class="app">
  <canvas id="cv" class="cv" role="img" aria-label="ゲームの画面"></canvas>
  <div id="vig" class="fx vig"></div>
  <div id="red" class="fx red"></div>
  <div id="black" class="fx black"></div>
  <div id="bars" class="bars"><i></i><i></i></div>
  <div id="hud" class="hud" hidden>
    <div id="h-day" class="day"></div>
    <button type="button" id="b-pause" class="pause" aria-label="中断">Ⅱ</button>
    <div id="h-home" class="home"><b>自宅</b><span id="h-dist"></span></div>
    <div id="h-msg" class="msg"></div>
    <div id="h-prompt" class="prompt" hidden><span id="h-ptx"></span><div class="pbar"><i id="h-pbar"></i></div></div>
    <div class="stam" aria-label="息"><i id="h-stam"></i></div>
  </div>
  <div id="pad" class="pad" hidden>
    <div id="stick" class="stick" role="group" aria-label="移動"><i id="knob" class="knob"></i></div>
    <div class="btns">
      <button type="button" id="b-act" class="pbtn" hidden>鍵</button>
      <button type="button" id="b-back" class="pbtn">振り返る</button>
    </div>
  </div>
  <div id="p-title" class="panel">
    <h1>なぜか、<br>走ってくる。</h1>
    <p class="sub">日本の、ふつうの 住宅街。夜。<br>アントン・シガーが、全力で 走ってくる。理由は ない。</p>
    <div class="row"><button type="button" id="t-start" class="btn big">はじめる</button></div>
    <div class="row">
      <button type="button" id="t-snd" class="btn"></button>
      <button type="button" id="t-skip" class="btn"></button>
    </div>
    <p class="help">彼の ほうが 速い。でも、角を 曲がると、彼は 見失って 立ち止まる。<br>家の 玄関で 鍵を 開ければ、その日は 終わり。</p>
    <p class="help" id="t-help"></p>
    <p class="note" id="t-best" hidden></p>
    <p class="note">非公式の ファンゲーム。暴力的な 死亡場面が あります。</p>
  </div>
  <div id="p-card" class="panel card" hidden>
    <div id="c-lines" class="lines"></div>
    <div id="c-btns" class="row col"></div>
  </div>
</div>
<script src="vendor/three.min.js"></script>

<script>
(function(){
"use strict";
// ── 00_core.js ──
// ───────── なぜか、走ってくる / 土台 ─────────
// 日本のふつうの住宅街で、なぜかアントン・シガーに追いかけられる。非公式のファンゲーム。
const DEBUG = location.hash === '#debug';

// 調整用の数値。【】が仕様上の名前。距離は m、時間は秒。
const PRM = {
  tile: 5,              // 【1 区画の大きさ】道の幅も同じ
  walk: 3.2,            // 【歩く速さ】m/s。歩く足音は、すぐそばでしか聞こえない
  run: 6.7,             // 【走る速さ】m/s。走る足音は、遠くまで聞こえる
  backMul: 0.88,        // 【振り返っているあいだの速さの倍率】
  stamina: 8,           // 【走りつづけられる時間】
  staminaRegen: 7,      // 【息が戻りきるまで】
  staminaDelay: 0.8,    // 【息が戻りはじめるまで】
  staminaMin: 0.22,     // 【走りなおせる息の量】0〜1
  antonRun: 7.6,        // 【彼の走る速さ】m/s。こちらより速い
  antonFar: 0.5,        // 【離れているときの速さの上乗せ】割合。遠いほど速く走ってくる（34m 以上で最大）
  antonSearch: 5.2,     // 【見失って探しているときの速さ】
  antonTurn: 4.4,       // 【彼が向きを変える速さ】rad/s。角では膨らんで遅くなる
  antonDay: 0.04,       // 【1 日ごとの速さの上乗せ】割合
  stand: 4,             // 【最初に、立ったままこちらを見ている時間】
  standMove: 2.5,       // 【こちらがこれだけ動いたら、すぐ走りだす】
  see: 46,              // 【彼に見える距離】
  near: 8,              // 【見回さなくても気づく距離】
  lose: 0.5,            // 【姿が見えなくなってから、見失うまで】そのあとは、最後に見た場所で見回すまで気づかない
  hearRun: 8,           // 【走る足音が聞こえる距離】塀のむこうでも聞こえる
  hearWalk: 3,          // 【歩く足音が聞こえる距離】
  lookPause: 1.2,       // 【見失った場所で立ち止まって見回す時間】
  guess: 0.45,          // 【見失ったあと、正しい方向を選ぶ確率】外れても、まぐれで当たることはある
  guessDay: 0.05,       // 【1 日ごとの、その確率の上乗せ】
  ping: 18,             // 【見失ったままでも、居場所に気づくまで】
  catchDist: 1.0,       // 【つかまる距離】
  antonStart: 7,        // 【最初の彼との間隔】区画
  homeDist: 17,         // 【1 日目の、家までの道のり】区画
  homeStep: 3,          // 【1 日ごとに遠くなる分】区画
  unlock: 2.6,          // 【玄関の鍵を開けるのにかかる時間】
  antonLight: 1.5,      // 【彼を照らす光の強さ】暗い道でも姿が分かるように
  fov: 62,              // 【視野】度（縦。横長の画面での値。縦長の画面では、横が狭くなりすぎないように広げる）
  fovRun: 6,            // 【走っているあいだ、視野が広がる分】
  fovStand: 30,         // 【彼が立ってこちらを見ているあいだの視野】遠くの彼に、目が吸い寄せられる
  eye: 1.62,            // 【目の高さ】
};

// 色。16 進の色は画面での見た目（sRGB）なので、光の計算に使う前に直す。直さないと、暗い色が白っぽく浮く
const C3 = hex => new THREE.Color(hex).convertSRGBToLinear();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);       // t が a〜b のどこにあるか（0〜1）
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
// 種から決まる乱数（町を作るのに使う。同じ種なら同じ町）
function mulberry(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// 保存（何日目まで生きたか、音の設定、二通りの死にかたをそれぞれ何回見たか = nb, nn）。残らなくても遊べる。
const Store = {
  KEY: 'nazeka.v1', d: null,
  load() { this.d = { best: 0, mute: 0, skip: 0, nb: 0, nn: 0 }; try { const s = localStorage.getItem(this.KEY); if (s) Object.assign(this.d, JSON.parse(s)); } catch (e) { /* 残っていなくてもよい */ } return this.d; },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.d)); } catch (e) { /* 残せなくてもよい */ } },
};

// 入力。キーボード・マウス・タッチをまとめる。
//   mvx 横（右が正）, mvy 前後（前が正）, run 走る, back 振り返る, act 決定（押しつづけ）, lookX/lookY 視点を動かした量（rad）
const Input = {
  held: {}, mvx: 0, mvy: 0, run: false, back: false, act: false, actHit: false, pauseHit: false, anyHit: false, lookX: 0, lookY: 0,
  stick: { on: false, x: 0, y: 0 }, tBack: false, tAct: false,
  KEYS: { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', KeyD: 'right', ArrowLeft: 'tl', ArrowRight: 'tr',
    ShiftLeft: 'run', ShiftRight: 'run', KeyQ: 'back', KeyC: 'back', KeyE: 'act', KeyF: 'act', Enter: 'act', Space: 'act', Escape: 'pause', KeyP: 'pause' },
  press(k) { if (this.held[k]) return; this.held[k] = true; this.anyHit = true; if (k === 'act') this.actHit = true; else if (k === 'pause') this.pauseHit = true; },
  release(k) { this.held[k] = false; },
  clear() { this.held = {}; this.stick.on = false; this.tBack = this.tAct = false; },
  update(dt) {
    const h = this.held;
    let x = (h.right ? 1 : 0) - (h.left ? 1 : 0), y = (h.up ? 1 : 0) - (h.down ? 1 : 0), run = !!h.run;
    if (this.stick.on) { x = this.stick.x; y = -this.stick.y; const m = Math.hypot(x, y); if (m < 0.2) x = y = 0; else if (m > 0.86) run = true; }
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    this.mvx = x; this.mvy = y; this.run = run; this.back = !!h.back || this.tBack; this.act = !!h.act || this.tAct;
    this.lookX += ((h.tr ? 1 : 0) - (h.tl ? 1 : 0)) * 2.4 * dt;   // マウスが使えないときは、左右キーで向きを変える
  },
  endFrame() { this.actHit = this.pauseHit = this.anyHit = false; this.lookX = this.lookY = 0; },
};

// ── 01_audio.js ──
// ───────── 音 ─────────
// 音楽はない。夜の住宅街の虫の声と、足音と、心臓の音。彼の足音は、近いほど大きく、いる方向から聞こえる。
// すべてその場で合成する。
const Snd = (() => {
  let ac = null, master, sfxB, ambB, nbuf = null, muted = false, bugT = 0, on = false;
  function init() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ac = new AC(); } catch (e) { ac = null; return false; }
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.85;
    sfxB = ac.createGain(); sfxB.gain.value = 0.9; ambB = ac.createGain(); ambB.gain.value = on ? 1 : 0;
    sfxB.connect(master); ambB.connect(master);
    // 音が重なっても割れないように、大きすぎる山だけ丸める（半分の大きさまでは、そのまま通す）
    const pre = ac.createGain(), sh = ac.createWaveShaper(), cv = new Float32Array(2048);
    for (let i = 0; i < cv.length; i++) { const x = (i / (cv.length - 1) * 2 - 1) * 3, m = Math.abs(x); cv[i] = Math.sign(x) * (m <= 0.5 ? m : 0.5 + 0.5 * Math.tanh((m - 0.5) / 0.5)); }
    pre.gain.value = 1 / 3; sh.curve = cv; master.connect(pre); pre.connect(sh); sh.connect(ac.destination);
    const n = ac.sampleRate * 2; nbuf = ac.createBuffer(1, n, ac.sampleRate);
    const d = nbuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    // 遠くの街の、低いうなり
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nbuf; s.loop = true; f.type = 'lowpass'; f.frequency.value = 320; g.gain.value = 0.42; s.connect(f); f.connect(g); g.connect(ambB); s.start();
    return true;
  }
  function unlock() { if (!init()) return; if (ac.state !== 'running') { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } }
  const now = () => ac.currentTime, at = s => now() + s;
  function out(g, o) {
    let node = g;
    if (o.pan != null && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); node = p; }
    node.connect(o.bus || sfxB);
  }
  // o: { t 開始, type 波形, to 終わりの高さ, v 大きさ, a 立ち上がり, hold のびる, pan 左右 }
  function tone(f, d, o) {
    o = o || {};
    const t = o.t || now(), os = ac.createOscillator(), g = ac.createGain();
    os.type = o.type || 'sine'; os.frequency.setValueAtTime(f, t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t + d);
    const v = o.v == null ? 0.2 : o.v, a = o.a || 0.004;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + a);
    if (o.hold) { g.gain.setValueAtTime(v, t + Math.max(a, d * 0.6)); g.gain.linearRampToValueAtTime(0.0001, t + d); } else g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    os.connect(g); out(g, o); os.start(t); os.stop(t + d + 0.03);
  }
  function noise(d, o) {
    o = o || {};

    } else if (m === 'title') {
      // 題の背景: 通りの先、街灯の下に、彼が立っている
      const P = G.P; Body.stand(Anton.J, G.t); Anton.yaw = Math.atan2(P.x - Anton.x, P.z - Anton.z); Anton.place();
      const tf = vfov(PRM.fovStand + 4); if (camera.fov !== tf) { camera.fov = tf; camera.updateProjectionMatrix(); }
      camera.position.set(P.x + Math.sin(G.t * 0.3) * 0.15, PRM.eye, P.z); camera.rotation.set(Math.sin(G.t * 0.23) * 0.015, P.yaw + Math.PI + Math.sin(G.t * 0.17) * 0.05, 0);
    }
    if (m !== 'boot') {
      sky.position.copy(camera.position); updLights(dt, camera.position.x, camera.position.z); Snd.tick(dt);
      if (G.noDraw) { /* 試験で早送りするときは描かない */ } else if (m === 'death' && Death.xray) renderer.render(Death.xr.scene, Death.xr.cam); else renderer.render(scene, camera);
    }
    Input.endFrame();
  }
  let last = 0;
  function loop(now) { const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; if (!G.hold) frame(dt); requestAnimationFrame(loop); }   // hold: 試験で、手動で進めるとき
  function go() { last = performance.now(); requestAnimationFrame(loop); }
  // 試験用: 止めたまま、決まった時間だけ進める
  function step(dt, n, quiet) { G.noDraw = true; for (let i = 1; i < (n || 1); i++) frame(dt); G.noDraw = !!quiet; frame(dt); G.noDraw = false; }   // n 回進めて、最後の 1 回だけ描く（quiet なら描かない）
  Object.assign(G, { init, go, title, startDay, pause, caught, dead, clear, say, shake, flash, onRun, onLost, onFound, lock, step });
  for (const [k, f] of [['camera', () => camera], ['scene', () => scene], ['renderer', () => renderer]]) Object.defineProperty(G, k, { get: f });   // 試験から見えるように
  return G;
})();

// ── 07_main.js ──
// ───────── 起動と、入力のつなぎこみ ─────────
function boot() {
  Store.load(); Snd.mute(!!Store.d.mute);
  if (typeof THREE === 'undefined') { document.querySelector('#p-title .sub').textContent = '3D の 部品を 読みこめませんでした。通信を 確かめて、開きなおして ください。'; return; }
  if (!Game.init()) return;
  const $ = id => document.getElementById(id), cv = $('cv'), stick = $('stick'), knob = $('knob');
  // 題の画面
  const lab = () => { $('t-snd').textContent = '音　' + (Store.d.mute ? '切' : '入'); $('t-skip').textContent = '死亡場面　' + (Store.d.skip ? '飛ばす' : '見る'); };
  lab();
  $('t-help').textContent = Game.touch ? '左下の 棒で 移動（大きく 倒すと 走る）。画面を なぞって 見回す。「振り返る」は 押している あいだ。'
    : '移動 W A S D　見回す マウス（または ← →）　走る Shift　振り返る Q を 押している あいだ　鍵 E　中断 Esc';
  $('t-start').addEventListener('click', () => { Snd.unlock(); Snd.sfx('ui'); Game.startDay(1, false); });
  $('t-snd').addEventListener('click', () => { Store.d.mute = Store.d.mute ? 0 : 1; Store.save(); Snd.mute(Store.d.mute); lab(); });
  $('t-skip').addEventListener('click', () => { Store.d.skip = Store.d.skip ? 0 : 1; Store.save(); lab(); });
  $('b-pause').addEventListener('click', () => Game.pause());
  // キーボード・マウス
  window.addEventListener('keydown', e => { const k = Input.KEYS[e.code]; if (k && !e.ctrlKey && !e.metaKey && !e.altKey) { Input.press(k); if (Game.mode === 'play' || Game.mode === 'death') e.preventDefault(); } });
  window.addEventListener('keyup', e => { const k = Input.KEYS[e.code]; if (k) Input.release(k); });
  window.addEventListener('blur', () => Input.clear());
  document.addEventListener('visibilitychange', () => { Snd.pause(document.hidden); Input.clear(); if (document.hidden) Game.pause(); });
  for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) document.addEventListener(ev, () => Snd.unlock(), true);
  document.addEventListener('pointerlockchange', () => { const was = Game.locked; Game.locked = document.pointerLockElement === cv; if (Game.locked) Game.noLock = false; if (was && !Game.locked) Game.pause(); });   // Esc で視点の固定が外れたら、中断にする
  document.addEventListener('pointerlockerror', () => { Game.noLock = true; });
  document.addEventListener('mousemove', e => { if (Game.locked) { Input.lookX += e.movementX * 0.0023; Input.lookY += e.movementY * 0.0023; } });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  // 画面をなぞって見回す（タッチ）。マウスなら、クリックで視点を固定する
  let lid = null, lx = 0, ly = 0;
  cv.addEventListener('pointerdown', e => {
    Input.anyHit = true;
    if (e.pointerType === 'mouse' && Game.mode === 'play' && !Game.locked) Game.lock();   // 固定できなくても、押したまま動かせば見回せる
    lid = e.pointerId; lx = e.clientX; ly = e.clientY; try { cv.setPointerCapture(e.pointerId); } catch (er) { /* なくても動く */ }
  });
  cv.addEventListener('pointermove', e => { if (e.pointerId !== lid) return; Input.lookX += (e.clientX - lx) * 0.0052; Input.lookY += (e.clientY - ly) * 0.0042; lx = e.clientX; ly = e.clientY; });
  for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, e => { if (e.pointerId === lid) lid = null; });
  // 移動の棒
  let sid = null;
  const setStick = e => {
    const r = stick.getBoundingClientRect(), R0 = 44; let x = (e.clientX - (r.left + r.width / 2)) / R0, y = (e.clientY - (r.top + r.height / 2)) / R0;
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    Input.stick.on = true; Input.stick.x = x; Input.stick.y = y; knob.style.transform = 'translate(' + Math.round(x * R0) + 'px,' + Math.round(y * R0) + 'px)';
  };
  const endStick = () => { sid = null; Input.stick.on = false; Input.stick.x = Input.stick.y = 0; knob.style.transform = ''; };
  stick.addEventListener('pointerdown', e => { e.preventDefault(); sid = e.pointerId; try { stick.setPointerCapture(e.pointerId); } catch (er) { /* なくても動く */ } setStick(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === sid) setStick(e); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) stick.addEventListener(ev, endStick);
  for (const [id, key] of [['b-back', 'tBack'], ['b-act', 'tAct']]) {
    const b = $(id), up = () => { Input[key] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (er) { /* なくても動く */ } Input[key] = true; Input.anyHit = true; b.classList.add('on'); });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
  window.addEventListener('touchstart', () => { if (!Game.touch) { Game.touch = true; } }, { passive: true });
  Game.title(); Game.go();
  if (DEBUG) window.ATL = { Game, Anton, Town, Death, Body, Snd, PRM, Input, Store };
}
boot();

})();
</script>
