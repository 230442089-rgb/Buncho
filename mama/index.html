<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ふたりとも、おいでぇ♡</title>
<style>

@font-face { font-family: 'Zen Maru Gothic'; src: url('../chase/fonts/ZenMaruGothic-Medium.ttf'); font-weight: 500; }
@font-face { font-family: 'Zen Maru Gothic'; src: url('../chase/fonts/ZenMaruGothic-Bold.ttf'); font-weight: 700; }

#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; transform-origin: 0 0; }

</head>
