<style>
/* 夜の春日井。黒に近い紺の闇、白い蛍光灯、留保の赤い印。画面の文字は少なく、大きく。 */

#feed div { animation: feed 2.6s forwards; } #feed b { color: var(--ink); }

/* 画面の縁：被弾・朔 */
#dir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; } #dir i { position: absolute; left: -40px; top: -118px; width: 80px; height: 14px; border-radius: 40px 40px 0 0 / 14px 14px 0 0; background: radial-gradient(ellipse at 50% 100%, rgba(255,80,90,.95), rgba(255,80,90,0) 70%); }
