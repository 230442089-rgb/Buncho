/* 事象のアトリエ: むかしのパソコンの画面 */
/* レイアウト: 黒い縁の中に画面が 1 枚。上がデスクトップ（アイコンと窓）、下がタスクバー。
   ATELIER の窓の中に 320x240 の画面。タッチ端末では窓の下に十字ボタンが出る。 */
/* 見た目は 1 種類だけ（むかしの画面）。明暗テーマでは変えない。 */
:root{
  --face:#c0c0c0; --face-hi:#ffffff; --face-mid:#dfdfdf; --face-lo:#808080; --face-dk:#000000;
  --ink:#000000; --ink-dis:#808080; --paper:#ffffff; --note:#fffbd6; --tip:#ffffe1;
  --bar-a:#08216b; --bar-b:#6f90c4; --bar-ink:#ffffff;
  --bar-off-a:#7b7b7b; --bar-off-b:#b4b4b4; --bar-off-ink:#d6d6d6;
  --sel:#08216b; --sel-ink:#ffffff;
  --bezel:#050505; --desk:#2b5356; --desk-ink:#ffffff; --desk-shade:#000000; --warn:#a00000;
  --raised:inset -1px -1px 0 var(--face-dk),inset 1px 1px 0 var(--face-hi),inset -2px -2px 0 var(--face-lo),inset 2px 2px 0 var(--face-mid);
  --pressed:inset 1px 1px 0 var(--face-dk),inset -1px -1px 0 var(--face-hi),inset 2px 2px 0 var(--face-lo);
  --sunken:inset 1px 1px 0 var(--face-lo),inset -1px -1px 0 var(--face-hi),inset 2px 2px 0 var(--face-dk),inset -2px -2px 0 var(--face-mid);
  --thin:inset 1px 1px 0 var(--face-lo),inset -1px -1px 0 var(--face-hi);
  --font:"AtelierDot","DotGothic16","MS Gothic","Osaka-Mono","IPAGothic",monospace;
  --px:1px;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;box-sizing:border-box;overflow:hidden;background-color:var(--bezel);color:var(--ink);
  font:16px/16px var(--font);
  padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;
  image-rendering:pixelated;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;margin:0;border:0;border-radius:0;background:none;padding:0;cursor:default;touch-action:manipulation}
[hidden]{display:none!important}

.screen{position:relative;height:100%;display:flex;flex-direction:column;background:var(--desk);overflow:hidden}
.desk{position:relative;flex:1;min-height:0}

/* デスクトップのアイコン */
.icons{position:absolute;left:2px;top:8px;bottom:4px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:10px 4px}
.dicon{width:116px;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--desk-ink);text-shadow:1px 1px 0 var(--desk-shade)}
.dicon i{display:block;width:32px;height:32px;background-size:32px 32px;background-repeat:no-repeat}
.dicon span{padding:0 2px;max-width:116px;overflow:hidden;white-space:nowrap}
.dicon.on span,.dicon:focus-visible span{background:var(--sel);color:var(--sel-ink);text-shadow:none;outline:1px dotted var(--desk-ink)}
.dicon:focus-visible{outline:none}

/* タスクバー */
.taskbar{position:relative;z-index:90000;flex:none;height:30px;box-sizing:border-box;display:flex;align-items:center;gap:4px;padding:4px 3px 2px;background:var(--face);
  box-shadow:inset 0 1px 0 var(--face-mid),inset 0 2px 0 var(--face-hi)}
.start,.task{height:24px;display:flex;align-items:center;gap:4px;background:var(--face);box-shadow:var(--raised);white-space:nowrap;overflow:hidden}
.start{flex:none;padding:0 6px 0 4px}
.start i,.task i{flex:none;width:16px;height:16px;background-size:16px 16px;background-repeat:no-repeat}
.start.on,.task.on{box-shadow:var(--pressed);background:var(--face-mid)}
.tasks{flex:1;min-width:0;height:24px;display:flex;gap:3px}
.task{flex:1 1 0;min-width:0;max-width:200px;padding:0 5px;text-align:left}
.task span{min-width:0;overflow:hidden}
.tray{flex:none;height:24px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;box-shadow:var(--thin)}
.tray-b{width:16px;height:16px;background-size:16px 16px;background-repeat:no-repeat}

/* 窓 */
#wins{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
.win,.menu,.blocker{pointer-events:auto}
.win{position:absolute;left:0;top:0;background:var(--face);padding:2px;box-shadow:var(--raised),2px 2px 0 rgba(0,0,0,.4)}
.tb{display:flex;align-items:center;gap:2px;height:20px;padding:1px 2px 1px 3px;background:linear-gradient(90deg,var(--bar-a),var(--bar-b));color:var(--bar-ink)}
.win.inact .tb,.win.flash .tb{background:linear-gradient(90deg,var(--bar-off-a),var(--bar-off-b));color:var(--bar-off-ink)}
.tb-ic{flex:none;width:16px;height:16px;margin-right:2px;background-size:16px 16px;background-repeat:no-repeat}
.tb-tx{flex:1;min-width:0;height:16px;white-space:nowrap;overflow:hidden}
.tb-b{flex:none;width:18px;height:16px;background-color:var(--face);background-size:18px 16px;background-repeat:no-repeat;
  box-shadow:inset -1px -1px 0 var(--face-dk),inset 1px 1px 0 var(--face-hi),inset -2px -2px 0 var(--face-lo)}
.tb-b:active{box-shadow:inset 1px 1px 0 var(--face-dk),inset -1px -1px 0 var(--face-hi);background-position:1px 1px}
.tb-b.x{margin-left:2px}
.wb{padding:8px}
.win.app .wb,.win.pad0 .wb{padding:0}

/* メニューバー */
.mb{display:flex;height:22px;align-items:center}
.mi{height:20px;padding:0 6px;line-height:20px;white-space:nowrap}
.mi.on{background:var(--sel);color:var(--sel-ink)}
.narrow .ak{display:none}
.busy .mi{color:var(--ink-dis);text-shadow:1px 1px 0 var(--face-hi)}
.win.busy,.win.busy *{cursor:wait}
.menu{position:absolute;z-index:100000;background:var(--face);padding:3px;min-width:150px;box-shadow:var(--raised),2px 2px 0 rgba(0,0,0,.4)}
.menu button{display:flex;justify-content:space-between;gap:20px;width:100%;box-sizing:border-box;text-align:left;height:24px;line-height:24px;padding:0 10px 0 22px;white-space:nowrap;position:relative}
.menu button:hover,.menu button:focus-visible{background:var(--sel);color:var(--sel-ink);outline:none}
.menu button.dis,.menu button.dis:hover,.menu button.dis:focus-visible{color:var(--ink-dis);text-shadow:1px 1px 0 var(--face-hi);background:none}
.menu button.chk::before{content:"";position:absolute;left:5px;top:7px;width:9px;height:9px;background:currentColor;
  clip-path:polygon(0 44%,22% 44%,22% 56%,33% 56%,33% 67%,44% 67%,44% 56%,56% 56%,56% 44%,67% 44%,67% 33%,78% 33%,78% 22%,89% 22%,89% 11%,100% 11%,100% 33%,89% 33%,89% 44%,78% 44%,78% 56%,67% 56%,67% 67%,56% 67%,56% 78%,44% 78%,44% 89%,33% 89%,33% 78%,22% 78%,22% 67%,11% 67%,11% 56%,0 56%)}
.menu button.rad::before{content:"";position:absolute;left:7px;top:9px;width:6px;height:6px;background:currentColor}
.menu button.ic{background-repeat:no-repeat;background-position:3px 4px;background-size:16px 16px}
.menu hr{border:0;border-top:1px solid var(--face-lo);border-bottom:1px solid var(--face-hi);margin:3px 2px}

/* ツールバー */
.tbar{display:flex;align-items:center;gap:1px;height:26px;box-sizing:border-box;padding:2px 3px 1px;box-shadow:inset 0 1px 0 var(--face-lo),inset 0 2px 0 var(--face-hi)}
.tbtn{flex:none;width:24px;height:22px;background-position:center;background-repeat:no-repeat;background-size:16px 16px}
.tbtn:hover{box-shadow:inset -1px -1px 0 var(--face-lo),inset 1px 1px 0 var(--face-hi)}
.tbtn:active{box-shadow:inset 1px 1px 0 var(--face-lo),inset -1px -1px 0 var(--face-hi);background-position:calc(50% + 1px) calc(50% + 1px)}
.tbtn[disabled],.busy .tbtn{opacity:.3;box-shadow:none}
.tsep{flex:none;width:2px;height:18px;margin:0 3px;box-shadow:inset 1px 0 0 var(--face-lo),inset -1px 0 0 var(--face-hi)}
.tip{position:absolute;z-index:100001;background:var(--tip);color:#000;padding:2px 5px;box-shadow:0 0 0 1px #000;white-space:nowrap;pointer-events:none}

/* 画面 */
.cl{position:relative;padding:2px;background:#000;line-height:0;box-shadow:inset 1px 1px 0 var(--face-lo),inset -1px -1px 0 var(--face-hi),inset 2px 2px 0 var(--face-dk)}
.view{display:block;width:320px;height:240px;image-rendering:crisp-edges;image-rendering:pixelated;background:#000}
.scan{position:absolute;left:2px;top:2px;right:2px;bottom:2px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.26) 0,rgba(0,0,0,.26) calc(var(--px)*.34),rgba(0,0,0,0) calc(var(--px)*.34),rgba(0,0,0,0) var(--px))}
.scan.no{display:none}

/* ステータスバー */
.sb{display:flex;gap:2px;padding-top:2px}
.sb span{display:block;height:16px;padding:3px 5px;white-space:nowrap;overflow:hidden;box-shadow:var(--thin)}
.sb .sb-msg{flex:1;min-width:0}
.sb .sb-mat{flex:none;min-width:24px;text-align:right}
.sb .sb-pos{flex:none}
.narrow .sb-pos{display:none}
.sb .sb-gg{flex:none;width:42px;padding:3px}
.sb .sb-gg i{display:block;width:0;height:16px;background:repeating-linear-gradient(90deg,var(--sel) 0,var(--sel) 5px,rgba(0,0,0,0) 5px,rgba(0,0,0,0) 7px)}
.sb .sb-gg.warn i{background:repeating-linear-gradient(90deg,var(--warn) 0,var(--warn) 5px,rgba(0,0,0,0) 5px,rgba(0,0,0,0) 7px)}

/* ボタン・ダイアログ */
.btn{min-width:84px;height:26px;padding:0 10px;background:var(--face);line-height:24px;box-shadow:var(--raised)}
.btn:active{box-shadow:var(--pressed)}
.btn:focus-visible{outline:1px dotted var(--ink);outline-offset:-5px}
.btn[disabled]{color:var(--ink-dis);text-shadow:1px 1px 0 var(--face-hi)}
.btn.sm{min-width:0;height:22px;line-height:20px;padding:0 8px}
.dlg{max-width:calc(100% - 4px)}
.dlg .wb{display:flex;flex-direction:column;gap:10px;min-width:232px;max-width:340px;box-sizing:border-box}
.dlg-row{display:flex;gap:10px;align-items:flex-start}
.dlg-ic{flex:none;width:32px;height:32px;background-size:32px 32px;background-repeat:no-repeat}
.dlg-tx{flex:1;min-width:0;white-space:pre-wrap;line-height:20px}
.dlg-de{margin:0;padding:5px 6px;font:inherit;line-height:18px;white-space:pre-wrap;background:var(--paper);box-shadow:var(--sunken)}
.dlg-btns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.blocker{position:absolute;left:0;right:0;top:0;bottom:0}
.prog{height:20px;box-sizing:border-box;padding:3px;box-shadow:var(--thin)}
.prog i{display:block;width:0;height:14px;background:repeating-linear-gradient(90deg,var(--sel) 0,var(--sel) 8px,rgba(0,0,0,0) 8px,rgba(0,0,0,0) 10px)}

/* 設定の部品 */
.grp{margin:0;padding:6px 8px 8px;min-width:0;border:1px solid var(--face-lo);box-shadow:inset 1px 1px 0 var(--face-hi),1px 1px 0 var(--face-hi);display:flex;flex-direction:column;gap:2px}
.grp legend{padding:0 4px}
.orow{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;min-height:24px}
.ck{display:flex;align-items:center;gap:5px;height:24px;padding:0 2px;white-space:nowrap}
.ck i{flex:none;width:13px;height:13px;background:var(--paper);box-shadow:var(--sunken);background-repeat:no-repeat;background-size:13px 13px}
.ck:focus-visible{outline:1px dotted var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:100px;height:24px;margin:0;background:none;touch-action:pan-x}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--face);box-shadow:var(--thin)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:20px;margin-top:-8px;border-radius:0;background:var(--face);box-shadow:var(--raised)}
input[type=range]::-moz-range-track{height:4px;background:var(--face);box-shadow:var(--thin)}
input[type=range]::-moz-range-thumb{width:11px;height:20px;border:0;border-radius:0;background:var(--face);box-shadow:var(--raised)}
.fld{display:block;width:100%;box-sizing:border-box;height:24px;padding:2px 5px;margin:0;border:0;border-radius:0;outline:none;font:inherit;color:inherit;background:var(--paper);box-shadow:var(--sunken);
  -webkit-user-select:text;user-select:text;touch-action:manipulation}
.krow{display:flex;align-items:center;gap:8px;height:26px}
.krow b{font-weight:400;width:64px}
.krow em{font-style:normal;flex:1;min-width:0;white-space:nowrap;overflow:hidden;height:16px;padding:3px 5px;background:var(--paper);box-shadow:var(--thin)}
.krow.on em{background:var(--sel);color:var(--sel-ink)}

/* テキストの窓・一覧 */
.txt{margin:0;padding:6px 8px;width:336px;max-width:100%;height:300px;box-sizing:border-box;overflow:auto;
  font:inherit;line-height:20px;white-space:pre-wrap;background:var(--paper);-webkit-user-select:text;user-select:text;touch-action:pan-y;box-shadow:var(--sunken)}
.txt.nowrap{white-space:pre;touch-action:pan-x pan-y}
.txt.note{background:var(--note)}
.sheet{max-width:calc(100% - 4px);max-height:calc(100% - 4px);display:flex;flex-direction:column}
.sheet .wb{display:flex;flex-direction:column;gap:6px;box-sizing:border-box;min-height:0;flex:1}
.sheet.pad0 .wb{gap:0}
.list{width:336px;max-width:100%;max-height:360px;overflow:auto;background:var(--paper);touch-action:pan-y;box-sizing:border-box;box-shadow:var(--sunken);padding:3px}
.row{display:flex;justify-content:space-between;gap:12px;height:22px;line-height:22px;padding:0 6px;white-space:nowrap;width:100%;box-sizing:border-box;text-align:left}
.row i{flex:none;width:12px;height:12px;margin:5px 0;box-shadow:0 0 0 1px #000}
.row b{font-weight:400;flex:1;min-width:0;overflow:hidden}
.row em{font-style:normal;color:var(--ink-dis)}
.row.on{background:var(--sel);color:var(--sel-ink)}
.row.on em{color:var(--sel-ink)}
.row.un em{color:var(--warn)}
.files{width:344px;max-width:100%;height:230px;overflow:auto;background:var(--paper);touch-action:pan-y;box-sizing:border-box;box-shadow:var(--sunken);padding:6px 4px;
  display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px 2px}
.file{width:96px;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.file i{width:32px;height:32px;background-size:contain;background-repeat:no-repeat;background-position:center}
.file i.th{height:24px;margin:4px 0;box-shadow:0 0 0 1px #000}
.file span{max-width:96px;line-height:16px;word-break:break-all;text-align:center;padding:0 1px}
.file.on span{background:var(--sel);color:var(--sel-ink)}
.txt::-webkit-scrollbar,.list::-webkit-scrollbar,.files::-webkit-scrollbar{width:16px;height:16px}
.txt::-webkit-scrollbar-track,.list::-webkit-scrollbar-track,.files::-webkit-scrollbar-track{background:var(--face-mid)}
.txt::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb,.files::-webkit-scrollbar-thumb{background:var(--face);box-shadow:inset -1px -1px 0 var(--face-dk),inset 1px 1px 0 var(--face-hi),inset -2px -2px 0 var(--face-lo)}
.txt::-webkit-scrollbar-corner{background:var(--face)}
.picw{background:var(--face-lo);box-shadow:var(--sunken);padding:8px;display:flex;justify-content:center}
.pic{display:block;background:var(--paper);image-rendering:crisp-edges;image-rendering:pixelated;max-width:100%;box-shadow:0 0 0 1px var(--face-dk)}
.cap{line-height:18px;white-space:pre-wrap}

/* 起動画面・バージョン情報 */
.splash .wb{padding:0;display:flex;background:var(--paper);box-shadow:inset 0 0 0 1px var(--face-dk)}
.splash img,.about img{display:block;image-rendering:crisp-edges;image-rendering:pixelated}
.splash .ttl{flex:none;width:32px;height:228px;margin:0 6px 0 8px;align-self:center}
.splash .inf{flex:1;min-width:112px;padding:10px 8px 8px 2px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;line-height:18px;white-space:pre-wrap}
.about .pt{flex:none;box-shadow:var(--sunken);padding:2px;background:var(--paper)}

/* 十字ボタン */
.pad{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:5}
.dpad{position:relative;width:150px;height:150px;pointer-events:auto;touch-action:none}
.pb{position:absolute;width:50px;height:50px;background:var(--face);display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:var(--raised)}
.pb.up{left:50px;top:0}.pb.lf{left:0;top:50px}.pb.rt{left:100px;top:50px}.pb.dn{left:50px;top:100px}
.pb.mid{left:50px;top:50px;box-shadow:none;background:var(--face)}
.pb.on,.abtn.on{box-shadow:var(--pressed);background:var(--face-mid)}
.abtn{width:84px;height:84px;margin:0 4px 30px 0;background:var(--face);pointer-events:auto;touch-action:none;font-size:32px;line-height:84px;text-align:center;box-shadow:var(--raised)}

/* 電源を切ったあとの画面 */
.pwoff{position:absolute;left:0;top:0;right:0;bottom:0;z-index:200000;background:#000;color:#f80;display:flex;align-items:center;justify-content:center;text-align:center}
.pwoff p{margin:0;white-space:pre-wrap;line-height:24px}

/* ゆれ（つかまったとき） */
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,3px)}100%{transform:translate(0,0)}}
.shake{animation:shake .09s steps(5) infinite}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

</style>
</head>
<body>
<div id="screen" class="screen">
  <div id="desk" class="desk">
    <div id="icons" class="icons">
      <button type="button" class="dicon" id="ico-app"><i></i><span>事象のアトリエ</span></button>
      <button type="button" class="dicon" id="ico-readme"><i></i><span>よんでね.txt</span></button>
      <button type="button" class="dicon" id="ico-folder"><i></i><span>作品</span></button>
      <button type="button" class="dicon" id="ico-note" hidden><i></i><span>みてて.txt</span></button>
    </div>
    <div id="wins"></div>
    <div id="pad" class="pad" hidden>
      <div id="dpad" class="dpad" role="group" aria-label="十字ボタン">
        <div class="pb up" data-k="up">▲</div>
        <div class="pb lf" data-k="left">←</div>
        <div class="pb mid"></div>
        <div class="pb rt" data-k="right">→</div>
        <div class="pb dn" data-k="down">▼</div>
      </div>
      <button type="button" id="abtn" class="abtn" aria-label="取り込み">Ａ</button>
    </div>
  </div>
  <div id="taskbar" class="taskbar">
    <button type="button" id="start" class="start"><i></i><span>スタート</span></button>
    <div id="tasks" class="tasks"></div>
    <div id="tray" class="tray"><button type="button" id="tray-vol" class="tray-b" aria-label="音"></button><span id="clock">--:--</span></div>
  </div>
  <div id="off" class="pwoff" hidden><p id="off-tx"></p></div>
</div>

  g.fillStyle = c; x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (BAYER[(y + j) & 3][(x + i) & 3] < lv) g.fillRect(x + i, y + j, 1, 1);
}
// 線
function LN(g, x0, y0, x1, y1, c) {
  g.fillStyle = c; x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (let n = 0; n < 2000; n++) {
    g.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
// 塗りつぶし楕円（lv を渡すとディザ）
function EL(g, cx, cy, rx, ry, c, lv) {
  cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -ry; y <= ry; y++) {
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.001))));
    if (lv === undefined) R(g, cx - w, cy + y, w * 2 + 1, 1, c); else DI(g, cx - w, cy + y, w * 2 + 1, 1, c, lv);
  }
}
// 楕円の輪郭
function ELO(g, cx, cy, rx, ry, c) {
  g.fillStyle = c; let px = null, py = null;
  for (let a = 0; a <= 64; a++) {
    const t = a / 64 * Math.PI * 2, x = Math.round(cx + Math.cos(t) * rx), y = Math.round(cy + Math.sin(t) * ry);
    if (px !== null) LN(g, px, py, x, y, c);
    px = x; py = y;
  }
}
// 文字の行でドット絵を置く
function ROWS(g, x, y, arr, pal) {
  for (let j = 0; j < arr.length; j++) {
    const s = arr[j];
    for (let i = 0; i < s.length; i++) { const c = pal[s[i]]; if (c) { g.fillStyle = c; g.fillRect(x + i, y + j, 1, 1); } }
  }
}
function SPR(arr, pal) {
  let w = 0; for (const s of arr) w = Math.max(w, s.length);
  const o = mkCanvas(w, arr.length); ROWS(o.g, 0, 0, arr, pal); return o.c;
}
function C(w, h, fn) { const o = mkCanvas(w, h); fn(o.g); return o.c; }
// 1px のふちどりを付けた絵を返す（上下左右に 1px 大きくなる）
function outline(src, col) {

  const o = mkCanvas(w + 2, h + 2); const img = o.g.createImageData(w + 2, h + 2); const d = img.data; const c = rgb(col || '#303');
  const on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && s[(y * w + x) * 4 + 3] > 0;
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    const i = ((y + 1) * (w + 2) + x + 1) * 4;
    if (on(x, y)) { const k = (y * w + x) * 4; d[i] = s[k]; d[i + 1] = s[k + 1]; d[i + 2] = s[k + 2]; d[i + 3] = 255; }

  }

}
function flipH(src) { return C(src.width, src.height, g => { g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); }); }
// 形だけを 1 色で（stip: 市松に抜く）
function silh(src, col, stip) {

  const s = src.getContext('2d').getImageData(0, 0, w, h).data;
  const o = mkCanvas(w, h); const img = o.g.createImageData(w, h); const d = img.data; const c = rgb(col);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

    if (s[i + 3] > 0 && (!stip || ((x + y) & 1) === 0)) { d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; }
  }
  o.g.putImageData(img, 0, 0); return o.c;
}

// 文字。16px のドット文字を 1bit にして置く（半角 8px、全角 16px）。
const Text = (() => {
  const FONT = '16px AtelierDot, DotGothic16, "MS Gothic", monospace';
  const cache = new Map();
  const tmp = mkCanvas(256, 20, true);
  const cw = ch => { const c = ch.codePointAt(0); return (c < 0x100 || (c >= 0xff61 && c <= 0xff9f)) ? 8 : 16; };
  const width = s => { let w = 0; for (const ch of s) w += cw(ch); return w; };
  function make(s, col, out) {
    const w = Math.max(1, width(s)), h = 16;
    if (tmp.c.width < w) { tmp.c.width = w; }
    const t = tmp.g;
    t.clearRect(0, 0, tmp.c.width, 20); t.font = FONT; t.textBaseline = 'alphabetic'; t.fillStyle = '#fff';
    let x = 0; for (const ch of s) { t.fillText(ch, x, 14); x += cw(ch); }
    const src = t.getImageData(0, 0, w, h).data;
    const o = mkCanvas(w + 2, h + 2); const img = o.g.createImageData(w + 2, h + 2); const d = img.data;
    const fc = rgb(col), oc = out ? rgb(out) : null;
    const on = (px, py) => px >= 0 && py >= 0 && px < w && py < h && src[(py * w + px) * 4 + 3] > 110;
    for (let py = -1; py <= h; py++) for (let px = -1; px <= w; px++) {
      const i = ((py + 1) * (w + 2) + px + 1) * 4;
      if (on(px, py)) { d[i] = fc[0]; d[i + 1] = fc[1]; d[i + 2] = fc[2]; d[i + 3] = 255; }
      else if (oc && (on(px - 1, py) || on(px + 1, py) || on(px, py - 1) || on(px, py + 1) || on(px - 1, py - 1) || on(px + 1, py - 1) || on(px - 1, py + 1) || on(px + 1, py + 1))) {
        d[i] = oc[0]; d[i + 1] = oc[1]; d[i + 2] = oc[2]; d[i + 3] = 255;
      }
    }
    o.g.putImageData(img, 0, 0); return o.c;
  }
  function get(s, col, out) {
    const k = s + '\n' + col + '\n' + (out || '');
    let c = cache.get(k);
    if (!c) { if (cache.size > 500) cache.clear(); c = make(s, col, out); cache.set(k, c); }
    return c;
  }
  // opt: { out: ふちの色, align: 'center'|'right', scale: 整数倍 }
  function draw(g, s, x, y, col, opt) {
    opt = opt || {};
    const c = get(s, col || '#fff', opt.out || null), sc = opt.scale || 1, w = (c.width - 2) * sc;
    if (opt.align === 'center') x -= w / 2; else if (opt.align === 'right') x -= w;
    g.drawImage(c, Math.round(x) - sc, Math.round(y) - sc, c.width * sc, c.height * sc);
  }
  return { get, draw, width, clear() { cache.clear(); } };
})();

// 仕上げ: 減色とディザ。むかしの 256 色の画面のようにする。
const FX = { levels: 6, desat: 0, glitch: 0, invert: false };
const QLUT = {};
function qlut(lv) {
  if (QLUT[lv]) return QLUT[lv];
  const step = 255 / (lv - 1), t = new Uint8ClampedArray(768);
  for (let v = 0; v < 768; v++) t[v] = Math.round(clamp(v - 256, 0, 255) / step) * step;
  return (QLUT[lv] = t);
}
function postFX(sg, dg) {
  const img = sg.getImageData(0, 0, W, H), d = img.data;
  const lv = Math.max(2, FX.levels | 0), q = qlut(lv), amp = 255 / (lv - 1), des = FX.desat, inv = FX.invert;
  let i = 0;
  for (let y = 0; y < H; y++) {
    const br = BAYER[y & 3];
    for (let x = 0; x < W; x++, i += 4) {
      let r = d[i], g = d[i + 1], b = d[i + 2];
      if (des > 0) { const gr = (r * 77 + g * 150 + b * 29) >> 8; r += (gr - r) * des; g += (gr - g) * des; b += (gr - b) * des; }
      if (inv) { r = 255 - r; g = 255 - g; b = 255 - b; }
      const t = ((br[x & 3] + 0.5) / 16 - 0.5) * amp + 256;
      d[i] = q[(r + t) | 0]; d[i + 1] = q[(g + t) | 0]; d[i + 2] = q[(b + t) | 0]; d[i + 3] = 255;
    }
  }
  if (FX.glitch > 0.02) {
    const n = Math.floor(FX.glitch * 14);
    for (let k = 0; k < n; k++) {
      const y = irnd(0, H - 3), hh = irnd(1, 2), sh = irnd(-10, 10) * 4;
      if (!sh) continue;
      const a = y * W * 4, len = W * 4 * hh, row = d.slice(a, a + len);
      for (let j = 0; j < len; j++) d[a + j] = row[(j - sh + len * 4) % len];
    }
  }
  dg.putImageData(img, 0, 0);
}

// 音楽は流さない。あるのは場所の鳴り（空調、蛍光灯、風、水）と、遠くで ときどき鳴る何か、それと足音だけ。
// 音源はすべてその場で合成する。
// アセラが運動を奪うと、鳴りは沈み、こもって、止まる。無音になる。
const Snd = (() => {
  let ac = null, master, ambB, ambLP, ambG, sfxB, echoIn, det = null, nbuf = null;

  // 場所ごとの鳴り。air: [こもり具合 Hz, 大きさ]、ev: [名前, 平均の間隔 秒, ゆらぎ 0〜1, …]
  const SB = {
    atelier: { air: [700, 0.09], hum: 0.012, echo: 0.05, ev: [['clock', 1, 0], ['note', 14, 0.5, [60, 64, 67, 71, 72, 76], 0.05]] },

    under:   { air: [320, 0.2], hum: 0.035, buzz: 0.2, echo: 0.6, ev: [['drip', 5, 0.7], ['note', 19, 0.5, [50, 53, 57, 60], 0.05]] },
    street:  { air: [900, 0.05], hum: 0.03, wind: 0.1, echo: 0.12, ev: [['bugs', 1.7, 0.5], ['note', 21, 0.5, [57, 60, 62, 64, 69], 0.04]] },

    school:  { air: [600, 0.13], hum: 0.012, echo: 0.35, ev: [['chime', 55, 0.25], ['knock', 28, 0.6]] },
    pool:    { air: [900, 0.1], water: 0.24, echo: 0.7, ev: [['drip', 3.2, 0.7]] },
    parking: { air: [260, 0.26], hum: 0.04, buzz: 0.1, echo: 0.65, ev: [['drip', 9, 0.6], ['clank', 24, 0.6]] },
    station: { air: [380, 0.18], hum: 0.03, buzz: 0.12, echo: 0.5, ev: [['pa', 38, 0.4], ['rumble', 47, 0.4]] },
    danchi:  { air: [800, 0.07], wind: 0.16, echo: 0.25, ev: [['musen', 52, 0.3], ['bugs', 4, 0.6]] },
    fields:  { air: [900, 0.06], wind: 0.2, echo: 0.05, ev: [['frog', 0.55, 0.7], ['bugs', 2.4, 0.5]] },
    mall:    { air: [600, 0.12], hum: 0.02, echo: 0.45, ev: [['muzak', 4.6, 0.1]] },
    clinic:  { air: [560, 0.1], hum: 0.02, buzz: 0.14, echo: 0.2, ev: [['clock', 1, 0], ['pingpong', 41, 0.4]] },
    blank:   { air: [2600, 0.04], echo: 0.3, ev: [['modem', 9, 0.6]] },

  function init() {
    if (ac) return true;

    sfxB = ac.createGain(); sfxB.gain.value = sfxOn ? 0.9 : 0;

    echoIn.connect(dl); dl.connect(elp); elp.connect(fb); fb.connect(dl); elp.connect(master);
    if (ac.createConstantSource) { det = ac.createConstantSource(); det.offset.value = 0; det.start(); }
    const n = ac.sampleRate * 2; nbuf = ac.createBuffer(1, n, ac.sampleRate);
    const d = nbuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

    const filt = (type, f, q) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };

    L.airF = filt('lowpass', 500, 0.4); L.airG = gain(0); nsrc().connect(L.airF); L.airF.connect(L.airG); L.airG.connect(ambB);
    L.humG = gain(0); for (const [f, v] of [[50, 1], [100, 0.7], [150, 0.35], [200, 0.2]]) { const g = gain(v); osc('sine', f).connect(g); g.connect(L.humG); } L.humG.connect(ambB);
    L.buzzG = gain(0); const bz = filt('bandpass', 2900, 7); osc('sawtooth', 100).connect(bz); bz.connect(L.buzzG); L.buzzG.connect(ambB);

    g.gain.linearRampToValueAtTime(v, t + (o.a || 0.003));
    if (o.hold) { g.gain.setValueAtTime(v, t + Math.max(o.a || 0.003, d - (o.rel || 0.05))); g.gain.linearRampToValueAtTime(0.0001, t + d); }
    else g.gain.exponentialRampToValueAtTime(0.0001, t + d);

  // 遠くで ときどき鳴るもの。どれも小さく、少し音程がずれている。

    clock(t, e) { const k = (Math.round(t) & 1); noise(0.018, { t, v: 0.26, f: k ? 2300 : 1800, q: 5, bus: ambB, echo: e }); },
    note(t, e, sc, v) { far(pick(sc), t, v, 3.2, 0.7); },

    bugs(t) { const f = 4200 + Math.random() * 500, n = irnd(5, 9); for (let i = 0; i < n; i++) tone(f + Math.random() * 40, 0.03, { t: t + i * 0.055, v: 0.031, bus: ambB, bend: 1 }); },

    knock(t, e) { noise(0.3, { t, v: 0.35, f: 170, q: 0.7, ft: 'lowpass', bus: ambB, echo: 0.6 }); },   // どこかで戸が閉まる

    furin(t) { const n = irnd(2, 4); for (let i = 0; i < n; i++) tone(2100 + Math.random() * 1100, 1.3, { t: t + i * (0.12 + Math.random() * 0.25), v: 0.025, bus: ambB, bend: 1 }); },
    musen(t) { let d = irnd(1, 4); const sc = [57, 60, 62, 64, 67, 69, 72]; for (let i = 0; i < 7; i++) { far(sc[d], t + i * 1.05, 0.038, 2.2, 0.8); d = clamp(d + pick([-2, -1, -1, 1, 1, 2]), 0, sc.length - 1); } },
    muzak(t) { const ch = pick([[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]]); for (const m of ch) tone(mtof(m + 12), 5.2, { t, v: 0.01, type: 'triangle', a: 1.6, hold: 1, rel: 2.2, cents: -35 + Math.random() * 20, bus: ambB, bend: 1, echo: 0.5 }); },

const sprCache = new Map();
function mkObj(d) {
  const p = OBJ[d.k];
  if (!p) throw new Error('知らない物: ' + d.k);
  const o = Object.assign({ w: 1, h: 1, solid: !p.wall, opaque: false, layer: p.wall ? 'bake' : 'stand' }, p, d);
  if (p.make) {
    const key = d.k + '|' + (d.c || '') + '|' + (d.c2 || '') + '|' + (d.text || '') + '|' + (d.on ? 1 : 0) + (d.dusk ? 1 : 0);
    let s = sprCache.get(key);
    if (!s) { s = p.make(o); if (o.layer === 'stand') s = outline(s, '#212'); sprCache.set(key, s); }
    o.spr = s;
  }
  return o;
}
// 物を描く。sx, sy は物の左上タイルの画面位置（壁のものは壁の面の上端）。
function drawObj(g, o, sx, sy, wt, t, taken) {
  if (taken && o.spr) {   // スケッチされたものは白い切り抜きになる
    if (!o.cut) o.cut = silh(o.spr, '#fff', false);
    if (o.wall || o.layer !== 'stand') g.drawImage(o.cut, sx + (o.ox || 0), sy + (o.oy || 0));
    else g.drawImage(o.cut, sx + (o.ox || 0) - 1, sy + o.h * 16 - o.spr.height + (o.oy || 0) + 1);
    return;
  }
  if (o.draw) { o.draw(g, o, sx, sy, wt, t, taken); return; }
  if (!o.spr) return;
  if (o.wall || o.layer !== 'stand') g.drawImage(o.spr, sx + (o.ox || 0), sy + (o.oy || 0));
  else g.drawImage(o.spr, sx + (o.ox || 0) - 1, sy + o.h * 16 - o.spr.height + (o.oy || 0) + 1);
}

  // 画面の大きさ合わせ
  function fit() {

    const op = Store.d.opt, DW = desk.clientWidth, DH = desk.clientHeight, dpr = window.devicePixelRatio || 1;
    const side = S.touch && DW > DH * 1.25, padH = S.touch && !side ? 166 : 0, padW = side ? 330 : 0;
    pad.classList.toggle('side', side);
    const size = k => { main.cv.style.width = Math.round(W * k * dpr) / dpr + 'px'; main.cv.style.height = Math.round(H * k * dpr) / dpr + 'px'; };
    // 窓のふち・メニュー・ツールバー・ステータスバーの分を引いて、画面に入る最大の倍率を出す
    const room = () => Math.min((DW - padW - (main.w.offsetWidth - W)) / W, (DH - padH - (main.w.offsetHeight - H)) / H);
    main.tbar.hidden = !op.tb; main.sb.hidden = !op.sb;

    let fitS = room();
    if (fitS < 1 && !main.tbar.hidden) { main.tbar.hidden = true; fitS = room(); }   // 狭い画面では、ツールバーをたたむ
    // ドットがそろう倍率（端末の画素の整数倍）を優先。小さくなりすぎるときだけ半端な倍率を使う
    let s = Math.floor(fitS * dpr) / dpr;
    if ((s < fitS * 0.88 || s <= 0) && (dpr >= 1.5 || fitS < 1)) s = fitS >= 1 ? Math.floor(fitS * 4) / 4 : Math.floor(fitS * 100) / 100;
    s = clamp(s, 0.4, 4);
    if (op.zoom > 0) s = Math.min(op.zoom, s);
    size(s);
    main.w.style.setProperty('--px', s + 'px');
    main.w.classList.toggle('narrow', W * s < 420);
    bgi(main.bMax, op.zoom === 0 ? 'b_res' : 'b_max');
    main.bMax.setAttribute('aria-label', op.zoom === 0 ? '元に戻す' : '最大化');
    const ww = main.w.offsetWidth, wh = main.w.offsetHeight;
    let x = Math.round((DW - ww) / 2), y = Math.round((DH - padH - wh) / 2);
    if (main.pos && !S.touch) { x = clamp(main.pos.x, 40 - ww, DW - 40); y = clamp(main.pos.y, 0, Math.max(0, DH - 22)); }
    main.w.style.left = Math.max(S.touch ? 0 : 40 - ww, x) + 'px'; main.w.style.top = Math.max(0, y) + 'px';
  }

  // ── 起動・終了 ──
  function refreshDesk() { $('ico-note').hidden = Store.d.crashes < 2; }
  function splash(fast) {
    return new Promise(res => {
      const win = mkWin('', { cls: 'splash', bare: true, app: true });
      const im = el('img'); im.src = IMG.edelSplash; im.width = 144; im.height = 228; im.alt = ''; im.draggable = false;
      const ttl = C(32, 228, g => { Array.from(APP).forEach((ch, i) => Text.draw(g, ch, 0, 2 + i * 32, '#000', { scale: 2 })); }); ttl.className = 'ttl';
      const inf = el('div', 'inf'), pg = el('div', 'prog'), bar = el('i'); pg.append(bar);
      inf.append(el('div', '', 'Version\n' + verName(curVer()) + '\n\n(C) 2003'), pg, el('div', '', '読み込み中…'));
      win.body.append(im, ttl, inf);
      place(win); activate(win);
      let k = 0, done = false; const N = fast ? 4 : 9;
      const fin = () => { if (done) return; done = true; clearInterval(iv); closeWin(win); res(); };
      const iv = setInterval(() => { k++; bar.style.width = Math.round(k / N * 100) + '%'; if (k >= N) fin(); }, 120);
      win.w.addEventListener('click', fin);
    });
  }
  async function launch(name, quiet) {
    if (powerOff || starting) return;
    if (main) { if (name && name !== Store.d.cur) switchDoc(name); else activate(main); return; }
    starting = true;
    if (!quiet) { Snd.unlock(); Snd.sfx('boot'); }
    if (!DEBUG) await splash(Store.d.last === 'crash');   // 強制終了のあとは、起動画面を短く（やり直しは速く）
    starting = false;
    if (powerOff || main) return;
    const crashed = Store.d.last === 'crash';
    if (name && Store.d.docs[name]) Store.d.cur = name;
    main = buildMain(); busy = false;
    applyOpts(); fit();
    Game.init(main.cv); Game.open(Store.d.cur);
    Store.d.boots++; Store.save();
    activate(main); Game.redraw();   // ほかの窓が手前に来て止まっても、最初の 1 枚は見えているように
    if (crashed) Game.say('前回は 正常に 終了しませんでした', 6);
    if (!Store.d.readme && !DEBUG) { Store.d.readme = 1; Store.save(); openReadme(); }
  }
  // ATELIER の窓と、そこから開いた窓を ぜんぶ閉じる
  function closeApp() {
    closeMenu(true); hideTip();
    for (const o of all) if (o.app) { if (o.task) o.task.remove(); if (o.blocker) o.blocker.remove(); o.w.remove(); }
    all = all.filter(o => !o.app); modals = modals.filter(o => !o.app);
    if (viewer && viewer.app) viewer = null;
    main = null; listWin = null; busy = false; keyCap = null; active = null;
    Game.off(); Snd.amb(null); Input.clear();
    const t = topWin(); if (t) activate(t); else sync();
    refreshDesk(); fit();
  }
  async function quit() {
    if (!main || Game.mode === 'dead' || Game.mode === 'halt') return false;
    if (busy) { Snd.sfx('err'); return false; }   // 応答なし
    if (Game.carry.length > 0) {
      const i = await msgBox({ icon: 'ask', text: '保存していない 素材が ' + Game.carry.length + 'つ あります。\n終了すると 失われます。\n\n終了しますか？', buttons: ['はい', 'いいえ'] });
      if (i !== 0 || !main) return false;
    }
    Store.d.last = 'ok'; Store.save();
    Snd.sfx('close'); closeApp();
    return true;
  }
  // 強制終了
  async function crash() {
    const n = Store.d.crashes;
    closeMenu(); setBusy(true); setTitle('(応答なし)');
    await wait(700);
    if (!main) return;
    const hx = Math.floor(Math.random() * 65536).toString(16).toUpperCase().padStart(4, '0');
    await msgBox({
      title: 'ATELIER.EXE', icon: 'err', auto: 15000,
      text: 'このプログラムは\n不正な運動を 検出したため、\n強制終了されます。\n\n保存していない 素材は\n失われました。' + (n >= 2 ? '（' + n + '回目）' : ''),
      detail: 'ATELIER のページ違反です。\nモジュール : ' + (n >= 4 ? 'ﾐﾃﾃ.DLL' : 'ASERA.DLL') + '\nアドレス : 0167:BFF9' + hx,
      buttons: [n >= 3 && chance(0.5) ? '見てて' : '閉じる'],
    });
    if (!main) return;
    const DW = desk.clientWidth, DH = desk.clientHeight;
    for (let i = 0; i < (CALM ? 1 : 9); i++) {
      const g = mkWin('見てて', { cls: 'dlg', app: true });
      const row = el('div', 'dlg-row'), ic = el('i', 'dlg-ic'); bgi(ic, 'err'); row.append(ic, el('div', 'dlg-tx', '見てて')); g.body.append(row);
      const br = el('div', 'dlg-btns'); br.append(btn('btn', '見てて')); g.body.append(br);
      g.w.style.left = clamp(Math.round(DW / 2 - 150 + i * 18), 0, Math.max(0, DW - g.w.offsetWidth)) + 'px';
      g.w.style.top = clamp(Math.round(DH / 2 - 150 + i * 16), 0, Math.max(0, DH - g.w.offsetHeight)) + 'px';
      activate(g); Snd.sfx('err');
      await wait(65);
      if (!main) return;
    }
    await wait(450);
    closeApp();
  }
  // 電源を切る
  async function shutdown() {
    if ((await msgBox({ title: '終了', icon: 'ask', sys: true, text: 'コンピュータの 電源を\n切りますか？', buttons: ['はい', 'いいえ'] })) !== 0) return;
    if (main && !(await quit())) return;   // 保存していない素材があれば、ここで聞かれる
    closeMenu(true); hideTip();
    for (const o of all) { if (o.task) o.task.remove(); if (o.blocker) o.blocker.remove(); o.w.remove(); }
    all = []; modals = []; active = null; readme = note = folder = viewer = listWin = null;
    powerOff = true; Snd.sfx('shut');
    $('off-tx').textContent = 'コンピュータの 電源を 切る\n準備が できました。';
    const off = $('off'); off.hidden = false;
    const on = () => { off.removeEventListener('pointerdown', on); off.hidden = true; powerOff = false; Snd.unlock(); Snd.sfx('boot'); refreshDesk(); };
    setTimeout(() => off.addEventListener('pointerdown', on), 900);
  }
  function startMenu() {
    const b = $('start');
    if (menuEl && menuBtn === b) { closeMenu(); return; }
    const items = [{ label: APP, ic: 'app', fn: () => launch() }, { label: '作品', ic: 'folder', fn: openFolder }, { label: 'よんでね.txt', ic: 'txt', fn: openReadme }];
    if (Store.d.crashes >= 2) items.push({ label: 'みてて.txt', ic: 'note', fn: openNote });
    items.push(null, { label: '終了…', fn: shutdown });
    openMenu(b, items, true); Snd.sfx('blip');
  }

  // ── 状態の表示（ゲームから呼ばれる）──
  function setCell(k, t) { if (!main) return; const c = main.cache; if (c[k] !== t) { c[k] = t; main[k].textContent = t; } }
  const setMsg = t => setCell('msg', t);
  // mat: 素材の数、pos: 位置、g: 発見の目盛り（0〜1。いないときは -1）
  function setInfo(mat, pos, g) {
    if (!main) return;
    setCell('mat', mat); setCell('posEl', pos);
    const c = main.cache, w = g <= 0 ? 0 : Math.ceil(clamp(g, 0, 1) * 5) * 7, hot = g >= 0.6, cs = Game.canSave(), cr = Game.canReturn();
    if (c.g !== w) { c.g = w; main.gi.style.width = w + 'px'; }
    if (c.hot !== hot) { c.hot = hot; main.gg.classList.toggle('warn', hot); }
    if (c.cs !== cs) { c.cs = cs; main.tbn.save.disabled = !cs; }
    if (c.cr !== cr) { c.cr = cr; main.tbn.home.disabled = !cr; }
  }
  function setTitle(t) { if (main) setWinTitle(main, t == null ? base() : (t[0] === '(' ? base() + ' ' + t : t)); }
  function setBusy(b) {
    if (busy === b) return;
    busy = b;
    if (!main) return;
    main.w.classList.toggle('busy', b);
    if (b && menuEl && menuBtn && main.mb.contains(menuBtn)) closeMenu();
  }
  function shake(on) { if (main) main.w.classList.toggle('shake', on); }
  function updClock() {
    if (main && Game.mode === 'play' && !Game.paused && Game.motion < 0.5) return;   // 世界が止まっているあいだは、時計も止まる
    const d = new Date(), t = String(d.getHours()).padStart(2, '0') + ((d.getSeconds() & 1) ? ' ' : ':') + String(d.getMinutes()).padStart(2, '0'), c = $('clock');
    if (c.textContent !== t) c.textContent = t;
  }

  function initPad() {
    const dp = $('dpad'), ab = $('abtn');
    let cur = null, down = false;
    const mark = (d, on) => { const b = dp.querySelector('[data-k="' + d + '"]'); if (b) b.classList.toggle('on', on); };
    const setDir = d => { if (d === cur) return; if (cur) { Input.release(cur); mark(cur, false); } cur = d; if (d) { Input.press(d); mark(d, true); } };
    const calc = e => {
      const r = dp.getBoundingClientRect(), x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(x, y) < 10) return cur;
      return Math.abs(x) > Math.abs(y) ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');
    };
    const wake = () => { Snd.unlock(); if (main && active !== main && !modals.length) activate(main); };
    dp.addEventListener('pointerdown', e => { e.preventDefault(); wake(); down = true; try { dp.setPointerCapture(e.pointerId); } catch (er) { /* なくても動く */ } setDir(calc(e)); });
    dp.addEventListener('pointermove', e => { if (down) setDir(calc(e)); });
    const up = () => { down = false; setDir(null); };
    dp.addEventListener('pointerup', up); dp.addEventListener('pointercancel', up); dp.addEventListener('lostpointercapture', up);
    ab.addEventListener('pointerdown', e => { e.preventDefault(); wake(); try { ab.setPointerCapture(e.pointerId); } catch (er) { /* なくても動く */ } Input.press('act'); ab.classList.add('on'); });
    const aup = () => { Input.release('act'); ab.classList.remove('on'); };
    ab.addEventListener('pointerup', aup); ab.addEventListener('pointercancel', aup); ab.addEventListener('lostpointercapture', aup);
    ab.addEventListener('contextmenu', e => e.preventDefault()); dp.addEventListener('contextmenu', e => e.preventDefault());
  }
  function deskIcon(id, fn) {
    const b = $(id);
    b.addEventListener('click', () => { if (selIcon && selIcon !== b) selIcon.classList.remove('on'); selIcon = b; b.classList.add('on'); if (lastTouch) fn(); });
    b.addEventListener('dblclick', () => { if (!lastTouch) fn(); });
    b.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); fn(); } });
  }
  function init() {
    desk = $('desk'); wins = $('wins'); pad = $('pad'); tasksEl = $('tasks');
    S.touch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    mkIcons(); initPad(); refreshDesk(); applyOpts();
    deskIcon('ico-app', () => launch()); deskIcon('ico-readme', () => { Snd.unlock(); openReadme(); }); deskIcon('ico-folder', () => { Snd.unlock(); openFolder(); }); deskIcon('ico-note', () => { Snd.unlock(); openNote(); });
    $('start').addEventListener('click', startMenu);
    const tv = $('tray-vol');
    tv.addEventListener('click', () => { const op = Store.d.opt; op.mute = op.mute ? 0 : 1; Store.save(); applyOpts(); if (!op.mute) Snd.sfx('ding'); });
    tip(tv, () => (Store.d.opt.mute ? '音: 切' : '音: 入'));
    tip($('clock'), () => { const d = new Date(); return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'; });
    updClock(); setInterval(updClock, 500);
    window.addEventListener('resize', fit);
    for (const e of [$('screen'), desk]) e.addEventListener('scroll', () => { e.scrollLeft = 0; e.scrollTop = 0; });   // 画面そのものは動かさない
    window.addEventListener('touchstart', () => { if (!S.touch) { S.touch = true; fit(); } }, { passive: true });
    window.addEventListener('blur', () => Input.clear());
    document.addEventListener('visibilitychange', () => { Snd.pause(document.hidden); Input.clear(); });
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click']) document.addEventListener(ev, () => Snd.unlock(), true);
    document.addEventListener('pointerdown', e => {
      lastTouch = e.pointerType === 'touch' || e.pointerType === 'pen'; hideTip();
      const t = e.target;
      if (menuEl && !menuEl.contains(t) && !(t.closest && (t.closest('.mi') || t.closest('#start')))) closeMenu();
      if (selIcon && !(t.closest && t.closest('.dicon'))) { selIcon.classList.remove('on'); selIcon = null; }
    }, true);
    // 押したボタンに入力の焦点を残さない（決定キーで、もう一度押されてしまうため）。ダイアログの中は別。
    document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b && !b.closest('.dlg')) b.blur(); });
    $('screen').addEventListener('contextmenu', e => { if (!(e.target.closest && e.target.closest('.txt, .fld'))) e.preventDefault(); });
    window.addEventListener('keydown', e => {
      Snd.unlock();
      if (powerOff) return;
      if (keyCap) { e.preventDefault(); if (e.code === 'Escape') keyCap.cancel(); else keyCap.set(e.code); return; }
      if (menuEl) { if (e.code === 'Escape') closeMenu(); return; }
      if (modals.length) { if (e.code === 'Escape') { const t = modals[modals.length - 1]; if (t.close) t.close(); } return; }
      if (!main || active !== main) { if (e.code === 'Escape' && active && active !== main && active.close) active.close(); return; }
      if (e.code === 'F1') { e.preventDefault(); openReadme(); return; }
      if ((e.ctrlKey || e.metaKey) && e.code === 'KeyS') { e.preventDefault(); if (Game.canSave()) Game.saveAll(); else Snd.sfx('err'); return; }
      if (DEBUG) { if (e.code === 'F2') Game.debug('visit'); else if (e.code === 'F3') Game.debug('cone'); }
      const k = Input.map[e.code];
      if (k && !e.ctrlKey && !e.metaKey && !e.altKey) { Input.press(k); e.preventDefault(); }
    });
    window.addEventListener('keyup', e => { const k = Input.map[e.code]; if (k) { Input.release(k); if (main && active === main) e.preventDefault(); } });
  }
  return Object.assign(S, { init, launch, fit, msgBox, crash, quit, openPicture, openList, openReadme, openFolder, setMsg, setInfo, setTitle, setBusy, shake, notifyUpdate, docChanged, readmeText });
})();

// ── 12_main.js ──
// ───────── 起動 ─────────
function bootAll() {
  Store.load();
  Input.setKeys(Store.d.opt.keys);
  buildSprites();
  Shell.init();
  Game.run();
  Shell.launch(null, true);   // 開いたら、そのままソフトが立ち上がる。音は最初の操作から。
  if (DEBUG) window.ATL = { Game, Asera, Shell, Store, Snd, PRM, Input, World, Picture, BIOMES, Sprites };
}
const fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('16px AtelierDot', '事象のアトリエ').catch(() => {}) : Promise.resolve();
Promise.race([fontReady, wait(2500)]).then(() => { Text.clear(); bootAll(); });

})();
