/* 事象のアトリエ: 2000年代のフリーソフトふうの見た目 */
/* レイアウト: 雲の壁紙のデスクトップに灰色の窓が1枚。窓の中に 320x240 の画面。タッチ端末では下に十字ボタン。 */
/* 見た目は1種類だけ（むかしの画面）。明暗テーマでは変えない。 */
:root{
  --face:#c9c5d3; --face-hi:#ffffff; --face-mid:#e6e3ec; --face-lo:#8b8598; --face-dk:#2a2432;
  --ink:#17131d; --ink-dis:#8b8598; --paper:#ffffff; --note:#fffbd6;
  --bar-a:#2f2259; --bar-b:#8f7cc4; --bar-ink:#ffffff;
  --bar-off-a:#77727f; --bar-off-b:#aaa6b4;
  --sel:#2f2259; --sel-ink:#ffffff;
  --desk:#6f7fb5; --desk-ink:#ffffff; --desk-shade:#1b1b3a; --warn:#c2183f;
  --font:"AtelierDot","DotGothic16","MS Gothic","Osaka-Mono","IPAGothic",monospace;
  --px:1px;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;box-sizing:border-box;overflow:hidden;background-color:var(--desk);color:var(--ink);
  font:16px/16px var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;
  image-rendering:pixelated;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;margin:0;border:0;border-radius:0;background:none;padding:0;cursor:default;touch-action:manipulation}
[hidden]{display:none!important}

.desk{position:relative;height:100%}

/* デスクトップのアイコン */
.icons{position:absolute;left:0;top:10px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.dicon{width:104px;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--desk-ink);text-shadow:1px 1px 0 var(--desk-shade)}
.dicon i{display:block;width:32px;height:32px;background-size:32px 32px;background-repeat:no-repeat}
.dicon span{padding:0 2px;max-width:104px;overflow:hidden;white-space:nowrap}
.dicon:hover span,.dicon:focus-visible span{background:var(--sel);color:var(--sel-ink);text-shadow:none;outline:1px dotted var(--desk-ink)}
.dicon:focus-visible{outline:none}

/* 窓 */
#wins{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
.win,.menu,.blocker{pointer-events:auto}
.win{position:absolute;left:0;top:0;background:var(--face);padding:2px;
  box-shadow:inset -1px -1px 0 var(--face-dk),inset 1px 1px 0 var(--face-mid),inset -2px -2px 0 var(--face-lo),inset 2px 2px 0 var(--face-hi),3px 3px 0 rgba(20,16,40,.35)}
.tb{display:flex;align-items:center;gap:4px;height:20px;padding:1px 2px 1px 3px;background:linear-gradient(90deg,var(--bar-a),var(--bar-b));color:var(--bar-ink)}
.win.off .tb{background:linear-gradient(90deg,var(--bar-off-a),var(--bar-off-b))}
.win.flash .tb{background:linear-gradient(90deg,var(--bar-off-a),var(--bar-off-b))}
.tb-ic{flex:none;width:16px;height:16px;background-size:16px 16px;background-repeat:no-repeat}
.tb-tx{flex:1;min-width:0;height:16px;white-space:nowrap;overflow:hidden}
.tb-x{flex:none;width:18px;height:16px;background:var(--face);color:var(--ink);line-height:14px;text-align:center;
  box-shadow:inset -1px -1px 0 var(--face-dk),inset 1px 1px 0 var(--face-hi),inset -2px -2px 0 var(--face-lo)}
.tb-x:active{box-shadow:inset 1px 1px 0 var(--face-dk),inset -1px -1px 0 var(--face-hi)}
.wb{padding:8px}
.win.main .wb{padding:0}

/* メニューバー */
.mb{display:flex;height:22px;align-items:center}
.mi{height:20px;padding:0 6px;line-height:20px}
.mi u{text-decoration:underline}
.mi.on{background:var(--sel);color:var(--sel-ink)}
.mb.busy .mi{color:var(--ink-dis);text-shadow:1px 1px 0 var(--face-hi)}
.menu{position:absolute;z-index:900;background:var(--face);padding:3px;min-width:176px;
  box-shadow:inset -1px -1px 0 var(--face-dk),inset 1px 1px 0 var(--face-mid),inset -2px -2px 0 var(--face-lo),inset 2px 2px 0 var(--face-hi),3px 3px 0 rgba(20,16,40,.35)}
.menu button{display:block;width:100%;text-align:left;height:24px;line-height:24px;padding:0 12px 0 24px;white-space:nowrap;position:relative}
.menu button:hover,.menu button:focus-visible{background:var(--sel);color:var(--sel-ink);outline:none}
.menu button[disabled]{color:var(--ink-dis);text-shadow:1px 1px 0 var(--face-hi);background:none}
.menu button.chk::before{content:"●";position:absolute;left:4px;top:0}
.menu hr{border:0;border-top:1px solid var(--face-lo);border-bottom:1px solid var(--face-hi);margin:3px 2px}

/* 画面 */
.cl{position:relative;padding:2px;background:#000;line-height:0;
  box-shadow:inset 1px 1px 0 var(--face-lo),inset -1px -1px 0 var(--face-hi),inset 2px 2px 0 var(--face-dk)}
.view{display:block;width:320px;height:240px;image-rendering:crisp-edges;image-rendering:pixelated;background:#000}
.scan{position:absolute;left:2px;top:2px;right:2px;bottom:2px;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(10,6,24,.2) 0,rgba(10,6,24,.2) calc(var(--px)*.34),rgba(10,6,24,0) calc(var(--px)*.34),rgba(10,6,24,0) var(--px))}
.scan.no{display:none}

/* ステータスバー */
.sb{display:grid;grid-template-columns:auto 1fr auto;gap:2px;padding-top:2px}
.sb span{display:block;height:16px;padding:3px 5px;white-space:nowrap;overflow:hidden;
  box-shadow:inset 1px 1px 0 var(--face-lo),inset -1px -1px 0 var(--face-hi)}
.sb .sb-hint{grid-column:1 / 4;height:32px;white-space:normal}
.sb .sb-st{min-width:0}
.sb .warn{color:var(--warn)}

/* ボタン・ダイアログ */
.btn{min-width:84px;height:26px;padding:0 10px;background:var(--face);line-height:24px;
  box-shadow:inset -1px -1px 0 var(--face-dk),inset 1px 1px 0 var(--face-hi),inset -2px -2px 0 var(--face-lo),inset 2px 2px 0 var(--face-mid)}
.btn:active{box-shadow:inset 1px 1px 0 var(--face-dk),inset -1px -1px 0 var(--face-hi),inset 2px 2px 0 var(--face-lo)}
.btn:focus-visible{outline:1px dotted var(--ink);outline-offset:-5px}
.dlg{max-width:calc(100% - 8px)}
.dlg .wb{display:flex;flex-direction:column;gap:10px;min-width:232px;max-width:340px;box-sizing:border-box}
.dlg-row{display:flex;gap:10px;align-items:flex-start}
.dlg-ic{flex:none;width:32px;height:32px;background-size:32px 32px;background-repeat:no-repeat}
.dlg-tx{flex:1;min-width:0;white-space:pre-wrap;line-height:20px}
.dlg-de{margin:0;padding:5px 6px;font:inherit;line-height:18px;white-space:pre-wrap;background:var(--paper);
  box-shadow:inset 1px 1px 0 var(--face-lo),inset -1px -1px 0 var(--face-hi),inset 2px 2px 0 var(--face-dk)}
.dlg-btns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.blocker{position:absolute;left:-16px;right:-16px;top:0;bottom:0}

/* テキストの窓 */
.txt{margin:0;padding:6px 8px;width:336px;max-width:100%;height:300px;max-height:100%;box-sizing:border-box;overflow:auto;
  font:inherit;line-height:20px;white-space:pre-wrap;background:var(--paper);-webkit-user-select:text;user-select:text;touch-action:pan-y;
  box-shadow:inset 1px 1px 0 var(--face-lo),inset -1px -1px 0 var(--face-hi),inset 2px 2px 0 var(--face-dk)}
.txt.note{background:var(--note)}
.sheet .wb{display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
.sheet{max-width:calc(100% - 8px);max-height:calc(100% - 8px);display:flex;flex-direction:column}
.sheet .wb{min-height:0;flex:1}

/* 素材リスト */
.list{width:336px;max-width:100%;max-height:360px;overflow:auto;background:var(--paper);touch-action:pan-y;box-sizing:border-box;
  box-shadow:inset 1px 1px 0 var(--face-lo),inset -1px -1px 0 var(--face-hi),inset 2px 2px 0 var(--face-dk);padding:4px}
.li{display:grid;grid-template-columns:20px 1fr auto;gap:0 6px;padding:3px 4px;border-bottom:1px dotted var(--face-lo);line-height:17px}
.li:last-child{border-bottom:0}
.li i{width:16px;height:16px;margin-top:1px;background-size:16px 16px;background-repeat:no-repeat}
.li b{font-weight:400}
.li em{font-style:normal;color:var(--ink-dis)}
.li p{grid-column:2 / 4;margin:0;color:var(--ink-dis);white-space:normal}
.li.got em{color:var(--ink)}
.li.un em{color:var(--warn)}
.txt::-webkit-scrollbar,.list::-webkit-scrollbar{width:16px;height:16px}
.txt::-webkit-scrollbar-track,.list::-webkit-scrollbar-track{background:var(--face-mid)}
.txt::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb{background:var(--face);box-shadow:inset -1px -1px 0 var(--face-dk),inset 1px 1px 0 var(--face-hi),inset -2px -2px 0 var(--face-lo)}
.pic{display:block;background:var(--paper);image-rendering:crisp-edges;image-rendering:pixelated;max-width:100%;
  box-shadow:0 0 0 1px var(--face-dk)}
.cap{line-height:18px;white-space:pre-wrap}

/* 十字ボタン */
.pad{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:5}
.dpad{position:relative;width:150px;height:150px;pointer-events:auto;touch-action:none}
.pb{position:absolute;width:50px;height:50px;background:var(--face);display:flex;align-items:center;justify-content:center;pointer-events:none;
  box-shadow:inset -1px -1px 0 var(--face-dk),inset 1px 1px 0 var(--face-hi),inset -2px -2px 0 var(--face-lo),inset 2px 2px 0 var(--face-mid)}
.pb.up{left:50px;top:0}.pb.lf{left:0;top:50px}.pb.rt{left:100px;top:50px}.pb.dn{left:50px;top:100px}
.pb.mid{left:50px;top:50px;box-shadow:none;background:var(--face)}
.pb.on,.abtn.on{box-shadow:inset 1px 1px 0 var(--face-dk),inset -1px -1px 0 var(--face-hi),inset 2px 2px 0 var(--face-lo);background:var(--face-mid)}
.abtn{width:84px;height:84px;margin:0 4px 30px 0;background:var(--face);pointer-events:auto;touch-action:none;font-size:32px;line-height:84px;text-align:center;
  box-shadow:inset -1px -1px 0 var(--face-dk),inset 1px 1px 0 var(--face-hi),inset -2px -2px 0 var(--face-lo),inset 2px 2px 0 var(--face-mid)}

/* ゆれ（つかまったとき） */
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,3px)}100%{transform:translate(0,0)}}
.shake{animation:shake .09s steps(5) infinite}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

</style>

// 仕上げ: 減色とディザ。むかしの 256 色の画面のようにする。
const FX = { levels: 6, desat: 0, glitch: 0, invert: false };
const QLUT = {};
function qlut(lv) {
  if (QLUT[lv]) return QLUT[lv];
  const step = 255 / (lv - 1), t = new Uint8ClampedArray(768);
  for (let v = 0; v < 768; v++) t[v] = Math.round(clamp(v - 256, 0, 255) / step) * step;
  return (QLUT[lv] = t);
}
function postFX(sg, dg) {
  const img = sg.getImageData(0, 0, W, H), d = img.data;
  const lv = Math.max(2, FX.levels | 0), q = qlut(lv), amp = 255 / (lv - 1), des = FX.desat, inv = FX.invert;
  let i = 0;
  for (let y = 0; y < H; y++) {
    const br = BAYER[y & 3];
    for (let x = 0; x < W; x++, i += 4) {
      let r = d[i], g = d[i + 1], b = d[i + 2];
      if (des > 0) { const gr = (r * 77 + g * 150 + b * 29) >> 8; r += (gr - r) * des; g += (gr - g) * des; b += (gr - b) * des; }
      if (inv) { r = 255 - r; g = 255 - g; b = 255 - b; }
      const t = ((br[x & 3] + 0.5) / 16 - 0.5) * amp + 256;
      d[i] = q[(r + t) | 0]; d[i + 1] = q[(g + t) | 0]; d[i + 2] = q[(b + t) | 0]; d[i + 3] = 255;
    }
  }
  if (FX.glitch > 0.02) {
    const n = Math.floor(FX.glitch * 14);
    for (let k = 0; k < n; k++) {
      const y = irnd(0, H - 3), hh = irnd(1, 2), sh = irnd(-10, 10) * 4;
      if (!sh) continue;
      const a = y * W * 4, len = W * 4 * hh, row = d.slice(a, a + len);
      for (let j = 0; j < len; j++) d[a + j] = row[(j - sh + len * 4) % len];
    }
  }
  dg.putImageData(img, 0, 0);
}

// ───────── 音 ─────────
// 音源はすべてその場で合成する。むかしの MIDI 音源のオルゴールのような音。
// アセラが運動を奪うと、テンポが落ち、音程が沈み、こもって、止まる。
const Snd = (() => {
  let ac = null, master, lp, mus, sfxB, dly, fbk, det = null, nbuf = null;
  let on = true, motion = 1, lastM = -1, song = null, stepI = 0, nextT = 0;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ac = new AC(); } catch (e) { ac = null; return false; }
    master = ac.createGain(); master.gain.value = on ? 0.8 : 0;
    lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 12000; lp.Q.value = 0.3;
    mus = ac.createGain(); mus.gain.value = 0.55;
    sfxB = ac.createGain(); sfxB.gain.value = 0.9;
    dly = ac.createDelay(1.0); dly.delayTime.value = 0.36;
    fbk = ac.createGain(); fbk.gain.value = 0.3;
    mus.connect(lp); mus.connect(dly); dly.connect(fbk); fbk.connect(dly); dly.connect(lp);
    lp.connect(master); sfxB.connect(master); master.connect(ac.destination);
    if (ac.createConstantSource) { det = ac.createConstantSource(); det.offset.value = 0; det.start(); }
    const n = ac.sampleRate; nbuf = ac.createBuffer(1, n, n);
    const d = nbuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

  const now = () => ac.currentTime;

  function tone(f, d, o) {

    if (o.hold) { g.gain.setValueAtTime(v, t + Math.max(a, d - (o.rel || 0.05))); g.gain.linearRampToValueAtTime(0.0001, t + d); }

    if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + d);
    f.Q.value = o.q || 1;
    const v = o.v == null ? 0.2 : o.v;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + (o.a || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);

  function inst(kind, m, t, v, d) {
    const f = mtof(m);

    else if (kind === 'ep') { tone(f, d, { t, v, type: 'triangle', bus: mus, bend: 1 }); tone(f * 2, d * 0.5, { t, v: v * 0.18, bus: mus, bend: 1 }); }
    else if (kind === 'glass') { tone(f, d * 1.3, { t, v: v * 0.9, bus: mus, bend: 1 }); tone(f * 4.16, d * 0.22, { t, v: v * 0.12, bus: mus, bend: 1 }); }
    else if (kind === 'chip') { tone(f, d * 0.35, { t, v: v * 0.4, type: 'square', bus: mus, bend: 1 }); }

  const MOTIF = [2, -1, 4, -1, 5, -1, 2, -1, 1, -1, -1, 0, 1, -1, -1, -1, 2, -1, 4, -1, 7, -1, 6, -1, 5, -1, -1, -1, 4, -1, -1, -1];
  const ROOTS = [0, 5, 3, 4];

    title:   { bpm: 72, key: 60, sc: 'ion', lead: 'bell',  oct: 12, drop: 0.0,  padV: 0.04,  arp: 0.4 },
    atelier: { bpm: 70, key: 60, sc: 'ion', lead: 'bell',  oct: 12, drop: 0.08, padV: 0.035, arp: 0.3 },
    hall:    { bpm: 60, key: 58, sc: 'lyd', lead: 'glass', oct: 12, drop: 0.3,  padV: 0.03,  arp: 0.1 },
    sky:     { bpm: 84, key: 65, sc: 'lyd', lead: 'bell',  oct: 12, drop: 0.15, padV: 0.04,  arp: 0.6 },
    street:  { bpm: 54, key: 57, sc: 'aeo', lead: 'ep',    oct: 0,  drop: 0.35, padV: 0.03,  arp: 0.0, amb: 'bugs' },
    gogo:    { bpm: 64, key: 62, sc: 'mix', lead: 'ep',    oct: 12, drop: 0.2,  padV: 0.035, arp: 0.2, amb: 'semi' },

    wade() { noise(0.16, { v: 0.08, f: 700 + Math.random() * 300, fto: 300, q: 0.8 }); },

function los(r, x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, n = Math.ceil(Math.hypot(dx, dy) * 4);
  const sx = Math.floor(x0), sy = Math.floor(y0), ex = Math.floor(x1), ey = Math.floor(y1);

    if ((tx === sx && ty === sy) || (tx === ex && ty === ey)) continue;
    if (isOpaque(r, tx, ty)) return false;
  }
  return true;
}

const sprCache = new Map();
function mkObj(d) {
  const p = OBJ[d.k];
  if (!p) throw new Error('知らない物: ' + d.k);
  const o = Object.assign({ w: 1, h: 1, solid: true, opaque: false, layer: 'stand' }, p, d);
  if (p.make) {
    const key = d.k + '|' + (d.c || '') + '|' + (d.c2 || '');
    let s = sprCache.get(key);
    if (!s) { s = p.make(o); if (o.layer === 'stand') s = outline(s, '#303'); sprCache.set(key, s); }
    o.spr = s;
  }
  return o;
}
// 物を描く。sx, sy は物の左上タイルの画面位置。
function drawObj(g, o, sx, sy, wt, t, taken) {
  if (o.draw) { o.draw(g, o, sx, sy, wt, t, taken); return; }
  if (!o.spr) return;
  if (o.layer === 'stand') g.drawImage(o.spr, sx + (o.ox || 0) - 1, sy + o.h * 16 - o.spr.height + (o.oy || 0) + 1);
  else g.drawImage(o.spr, sx + (o.ox || 0), sy + (o.oy || 0));
}

function buildRoom(id) {
  const s = ROOMS[id], h = s.map.length, w = s.map[0].length;
  const r = { id, spec: s, w, h, solid: new Uint8Array(w * h), opaque: new Uint8Array(w * h), grid: new Array(w * h).fill(null), portals: new Map(), objs: [], layer: null };
  for (let y = 0; y < h; y++) {
    if (s.map[y].length !== w) console.warn('地図の幅が違う', id, y, s.map[y].length);
    for (let x = 0; x < w; x++) {
      const ch = s.map[y][x], i = y * w + x;
      if (ch === '#') { r.solid[i] = 1; r.opaque[i] = 1; } else if (ch === ' ' || ch === '=') r.solid[i] = 1;
    }
  }
  for (const p of s.portals) r.portals.set(p.y * w + p.x, p);
  for (const d of s.objs) {
    const o = mkObj(d); r.objs.push(o);
    if (!o.solid) continue;
    for (let yy = o.y; yy < o.y + o.h; yy++) for (let xx = o.x; xx < o.x + o.w; xx++) {
      const i = yy * w + xx; r.solid[i] = 1; if (o.opaque) r.opaque[i] = 1; r.grid[i] = o;
    }
  }
  const L = mkCanvas(w * 16, h * 16), th = THEME[s.theme];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) th.tile(L.g, r, x, y, s.map[y][x], x * 16, y * 16);
  for (const o of r.objs) if (o.layer === 'bake') drawObj(L.g, o, o.x * 16, o.y * 16, 0, 0, false);
  r.layer = L.c;
  return r;
}

// ── 08_asera.js ──
// ───────── アセラ ─────────
// 来訪の流れ:  absent（いない）→ omen（予兆。世界の運動が奪われていく。影だけが先に来る）
//            → present（走っては止まり、見回す）→ leaving（去る。運動が戻る）
// 見つけたら:  found（一瞬止まる）→ chase（まっすぐ来る）→ capture（つかまえる）
// 止まっているものは見えない。動いているもの（歩くエデル、影を写す手）だけが見える。
const Asera = (() => {
  const A = {
    st: 'absent', sub: '', t: 0, x: 0, y: 0, dir: 'down', vis: false, gauge: 0, n: 0,
    route: null, looks: [], lookT: 0, stay: 0, stayT: 0, omen: 0, next: null, feint: null, fe: false, lenient: false, angry: false,
    sh: { on: false, x: 0, y: 0, dir: 'right', route: null, fr: 0 }, orb: 0, pack: [],
    afters: [], afterT: 0, runT: 0, say: null, entry: null, susp: false, tickT: 0, rt: 0, gx: -1, gy: -1, speed: PRM.dashSpeed,
  };
  const COSF = Math.cos(PRM.fov * Math.PI / 180);
  const L_SEEK = ['エデル姉？', 'どこ？', 'ねえ', '見てて', 'いまの 見てた？', 'もう一回 やるから', 'あたし 速く なったよ', 'つぎも 見てて', 'いないの？'];
  const L_SEEK2 = ['見てて見てて', '見てた？見てた？', 'ﾐﾃﾃ', '隕九※縺ｦ', 'エデル姉エデル姉', 'ここ？', 'ねえねえねえ', 'もう一回もう一回'];
  const L_SUS = ['……？', 'うごいた？', 'いま、'];
  const L_LEAVE = ['……いないや', 'つぎ！', 'あっちかな', '……姉ちゃん'];
  const level = () => clamp(Store.d.saved.length + Game.carry.length, 0, PRM.maxLevel);

  function free(r, tx, ty) {
    if (isSolid(r, tx, ty) || portalAt(r, tx, ty)) return false;
    const e = Game.edel;
    if (tx === e.x && ty === e.y) return false;
    if (e.moving && tx === e.tx && ty === e.ty) return false;
    return true;
  }
  // 道のりに沿って進む。着いたら true。
  function stepRoute(m, dt, speed) {
    let adv = speed * dt;
    while (adv > 0 && m.route && m.route.length) {
      const p = m.route[0], dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy);
      if (d > 0.001) m.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      if (d <= adv) { m.x = p.x; m.y = p.y; m.route.shift(); adv -= d; } else { m.x += dx / d * adv; m.y += dy / d * adv; adv = 0; }
    }
    return !m.route || !m.route.length;
  }
  function bfs(r, sx, sy, gx, gy, ax, ay) {
    const w = r.w, st = sy * w + sx, prev = new Int32Array(w * r.h).fill(-1), q = [st];
    prev[st] = st;
    for (let qi = 0; qi < q.length; qi++) {
      const c = q[qi], cx = c % w, cy = (c / w) | 0;
      if (cx === gx && cy === gy) { const out = []; let k = c; while (k !== st) { out.unshift({ x: k % w, y: (k / w) | 0 }); k = prev[k]; } return out; }
      for (const d of DIRS) {
        const nx = cx + DV[d][0], ny = cy + DV[d][1];
        if (!inRoom(r, nx, ny)) continue;
        const ni = ny * w + nx;
        if (prev[ni] !== -1 || (nx === ax && ny === ay)) continue;
        if (!(nx === gx && ny === gy) && (isSolid(r, nx, ny) || portalAt(r, nx, ny))) continue;
        prev[ni] = c; q.push(ni);
      }
    }
    return null;
  }
  // つぎに走る先を決める。まっすぐ、壁まで、または途中まで。
  function planDash(r, x, y) {
    const e = Game.edel, opts = [];
    for (const d of DIRS) {
      const v = DV[d]; let n = 0, cx = x, cy = y;
      while (n < 12 && free(r, cx + v[0], cy + v[1])) { cx += v[0]; cy += v[1]; n++; }
      if (n < 1) continue;
      const toward = (e.x - x) * v[0] + (e.y - y) * v[1] > 0;
      let wgt = n * (toward ? 1.6 : 1);
      if (A.next && d === OPP[A.next.dir]) wgt *= 0.35;
      opts.push({ d, n, wgt });
    }
    if (!opts.length) return { x, y, dir: A.dir };
    let tot = 0; for (const o of opts) tot += o.wgt;
    let k = Math.random() * tot, c = opts[0];
    for (const o of opts) { k -= o.wgt; if (k <= 0) { c = o; break; } }
    let len = Math.max(irnd(Math.min(2, c.n), c.n), irnd(1, c.n));
    // 最初の来訪では、近くまでは来ない
    if (A.lenient) while (len > 1 && Math.hypot(x + DV[c.d][0] * len - e.x, y + DV[c.d][1] * len - e.y) < 4) len--;
    // いつも真横で止まるわけではない
    else if (len > 1 && chance(0.6) && Math.hypot(x + DV[c.d][0] * len - e.x, y + DV[c.d][1] * len - e.y) < 1.5) len -= irnd(1, Math.min(2, len - 1));
    return { x: x + DV[c.d][0] * len, y: y + DV[c.d][1] * len, dir: c.d };
  }
  // 増えた影（影獣）。溜めこんだ運動があふれて、本人とは別に歩きまわる。近くで動くものに気づく。
  function roam(r, m) {
    const opts = [], bx = Math.round(m.x), by = Math.round(m.y);
    for (const d of DIRS) {
      const v = DV[d]; let n = 0, cx = bx, cy = by;
      while (n < 6 && free(r, cx + v[0], cy + v[1])) { cx += v[0]; cy += v[1]; n++; }
      if (n) opts.push({ d, n });
    }
    if (!opts.length) return;
    const c = pick(opts), len = irnd(1, c.n);
    m.route = [{ x: bx + DV[c.d][0] * len, y: by + DV[c.d][1] * len }];
  }
  function spawnPack(r) {
    const lv = level(), n = lv >= PRM.packLevel2 ? 2 : lv >= PRM.packLevel1 ? 1 : 0, e = Game.edel;
    A.pack = [];
    const sp = r.spec.spawns.filter(s => free(r, s[0], s[1]) && Math.hypot(s[0] - e.x, s[1] - e.y) >= 4 && !(s[0] === A.entry.x && s[1] === A.entry.y));
    for (let i = 0; i < n && sp.length; i++) { const k = Math.floor(Math.random() * sp.length), s = sp.splice(k, 1)[0]; A.pack.push({ x: s[0], y: s[1], dir: 'right', route: null, wait: rnd(0.2, 0.8), fr: Math.random() * 2 }); }
  }
  function updPack(r, dt) {
    for (const m of A.pack) {
      m.fr += dt * 10;
      if (m.route && m.route.length) stepRoute(m, dt, PRM.packSpeed);
      else { m.wait -= dt; if (m.wait <= 0) { roam(r, m); m.wait = rnd(0.4, 1.1); } }
    }
  }
  function sees(r, ex, ey) {
    const dx = ex - A.x, dy = ey - A.y, d = Math.hypot(dx, dy);
    if (d > PRM.sight) return 0;
    if (d > PRM.nearSense) { const f = DV[A.dir]; if ((dx * f[0] + dy * f[1]) / d < COSF) return 0; }
    if (!los(r, A.x + 0.5, A.y + 0.5, ex + 0.5, ey + 0.5)) return 0;
    return lerp(PRM.gaugeNear, PRM.gaugeFar, clamp((d - 3) / (PRM.sight - 3), 0, 1));
  }
  function speak(text, d) { A.say = { text, t: 0, d: d || 1.3 }; Snd.sfx('voice'); }
  function trail(dt) {
    A.runT += dt; A.afterT -= dt;
    if (A.afterT <= 0) { A.afterT = 0.035; A.afters.push({ x: A.x, y: A.y, dir: A.dir, c: A.afters.length % 3, life: 0.22 }); }
  }
  function startDash(tg, allowFeint) {
    A.dir = tg.dir; A.sub = 'dash'; Snd.sfx('dash');
    const dist = Math.abs(tg.x - A.x) + Math.abs(tg.y - A.y);
    if (allowFeint && level() >= 3 && dist >= 3 && chance(PRM.feintChance)) {
      const v = DV[tg.dir]; A.feint = tg; A.fe = true; A.route = [{ x: Math.round(A.x) + v[0], y: Math.round(A.y) + v[1] }];
    } else { A.fe = false; A.route = [{ x: tg.x, y: tg.y }]; }
  }
  function arrive() {
    if (A.fe) { A.fe = false; A.dir = OPP[A.dir]; A.sub = 'flook'; A.lookT = 0.55; return; }
    // 着いたら時計回りに見回す。順番が決まっているので、つぎにどちらを向くかは読める。
    A.sub = 'look'; A.lookT = 0.15;
    A.looks = []; let d = A.dir;
    for (let i = 0, n = chance(0.5) ? 3 : 2; i < n; i++) { d = CW[d]; A.looks.push(d); }
  }
  function leave() {
    const r = Game.room, e = Game.edel, sx = Math.round(A.x), sy = Math.round(A.y);
    speak(pick(L_LEAVE), 1.2);
    let best = null;
    for (const s of r.spec.spawns) {
      if (!free(r, s[0], s[1])) continue;
      const p = bfs(r, sx, sy, s[0], s[1], e.x, e.y);
      if (p && (!best || p.length < best.length)) best = p;
    }
    A.sub = 'exit'; A.route = best && best.length ? best : [{ x: sx, y: sy }];
    Snd.sfx('dash');
  }
  function found() {
    const e = Game.edel;
    A.gauge = 1; A.st = 'found'; A.fe = false; A.feint = null; A.route = null;
    const dx = e.cx - A.x, dy = e.cy - A.y;
    A.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');

    const m = el('div', 'menu');
    for (const it of MENUS[name]()) {
      if (!it) { m.append(el('hr')); continue; }
      const b = el('button', it.chk ? 'chk' : '', it.label); b.type = 'button';
      if (it.dis) b.disabled = true;
      b.addEventListener('click', () => { closeMenu(); Snd.sfx('blip'); it.fn(); });
      m.append(b);
    }
    const dr = desk.getBoundingClientRect(), br = btn.getBoundingClientRect();
    wins.append(m);
    m.style.left = clamp(br.left - dr.left, 0, Math.max(0, desk.clientWidth - m.offsetWidth)) + 'px';
    m.style.top = (br.bottom - dr.top) + 'px';
    menuEl = m; menuName = name; btn.classList.add('on'); Game.paused = true; Input.clear(); Snd.sfx('blip');
  }
  function applyOpts() {
    if (main) main.scan.classList.toggle('no', !Store.d.scan);
    Snd.mute(!Store.d.sound);
  }

  // ── 画面の大きさ合わせ ──
  function fit() {
    pad.hidden = !S.touch || !main;
    if (!main) return;
    const DW = desk.clientWidth, DH = desk.clientHeight, dpr = window.devicePixelRatio || 1;
    const side = S.touch && DW > DH * 1.25, padH = S.touch && !side ? 166 : 0, padW = side ? 330 : 0;
    pad.classList.toggle('side', side);
    const size = k => { main.cv.style.width = Math.round(W * k * dpr) / dpr + 'px'; main.cv.style.height = Math.round(H * k * dpr) / dpr + 'px'; };
    size(1);
    // 窓のふち・メニュー・ステータスバーの分を引いて、画面に入る最大の倍率を出す
    const fitS = Math.min((DW - padW - (main.w.offsetWidth - W)) / W, (DH - padH - (main.w.offsetHeight - H)) / H);
    // ドットがそろう倍率（端末の画素の整数倍）を優先。小さくなりすぎるときだけ半端な倍率を使う
    let s = Math.floor(fitS * dpr) / dpr;
    if ((s < fitS * 0.88 || s <= 0) && (dpr >= 1.5 || fitS < 1)) s = fitS >= 1 ? Math.floor(fitS * 4) / 4 : Math.floor(fitS * 100) / 100;
    s = clamp(s, 0.4, 3);
    size(s);
    main.w.style.setProperty('--px', s + 'px');
    main.w.style.left = Math.max(0, Math.round((DW - main.w.offsetWidth) / 2)) + 'px';
    main.w.style.top = Math.max(0, Math.round((DH - padH - main.w.offsetHeight) / 2)) + 'px';
  }

  // ── 起動・終了 ──
  function refreshDesk() {
    $('ico-note').hidden = Store.d.crashes < 2;
    $('ico-bmp').hidden = Store.d.cleared < 1;
  }
  function launch(silent) {
    if (main) { focus(main.w); return; }
    if (silent !== true) { Snd.unlock(); Snd.sfx('boot'); }
    const m = mkWin(TITLE, { cls: 'main', icon: 'app' });
    const mb = el('div', 'mb');
    for (const [k, lb] of [['file', 'ファイル'], ['view', '表示'], ['help', 'ヘルプ']]) {
      const b = el('button', 'mi', lb); b.type = 'button';
      b.addEventListener('click', () => { if (menuEl && menuName === k) closeMenu(); else openMenu(k, b); b.blur(); });
      mb.append(b);
    }
    const cl = el('div', 'cl'), cv = el('canvas', 'view'), scan = el('div', 'scan'), sb = el('div', 'sb');
    cv.width = W; cv.height = H; cl.append(cv, scan);
    const hint = el('span', 'sb-hint'), mat = el('span', 'sb-mat'), st = el('span', 'sb-st'), ck = el('span', 'sb-ck');
    sb.append(hint, mat, st, ck); m.body.append(mb, cl, sb);
    main = Object.assign(m, { mb, cv, scan, hint, mat, st, ck, cache: {} });
    m.close = () => quit(false);
    cv.addEventListener('pointerdown', e => { Snd.unlock(); const r = cv.getBoundingClientRect(); Game.pointer((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H); });
    busy = false; fit(); applyOpts();
    Game.init(cv); Game.boot();
  }
  function closeAll() {
    closeMenu();
    for (const w of Array.from(wins.children)) w.remove();
    modals = []; main = null; busy = false;
    Game.off(); Game.paused = false; Input.clear(); Snd.music(null);
    refreshDesk(); fit();
    $('ico-app').focus({ preventScroll: true });
  }
  async function quit(fromTitle) {
    if (!main || Game.mode === 'dead' || Game.mode === 'halt') return;
    if (!fromTitle && Game.mode === 'play' && (Game.carry.length > 0)) {
      const i = await msgBox({ title: '終了', icon: 'ask', text: '保存していない 素材が ' + Game.carry.length + 'つ あります。\n終了すると 失われます。\n\n終了しますか？', buttons: ['はい', 'いいえ'] });
      if (i !== 0) return;
    }
    Store.d.last = 'ok'; Store.save();
    Snd.sfx('close'); closeAll();
  }
  // 強制終了
  async function crash() {
    const n = Store.d.crashes;
    closeMenu(); setBusy(true); setTitle(BASE + ' (応答なし)');
    await wait(700);
    if (!main) return;
    const hx = Math.floor(Math.random() * 65536).toString(16).toUpperCase().padStart(4, '0');
    await msgBox({
      title: 'ATELIER.EXE', icon: 'err', auto: 15000,
      text: 'このプログラムは\n不正な運動を 検出したため、\n強制終了されます。\n\n保存していない 素材は\n失われました。' + (n >= 2 ? '（' + n + '回目）' : ''),
      detail: 'ATELIER のページ違反です。\nモジュール : ' + (n >= 4 ? 'ﾐﾃﾃ.DLL' : 'ASERA.DLL') + '\nアドレス : 0167:BFF9' + hx,
      buttons: [n >= 3 && chance(0.5) ? '見てて' : '閉じる'],
    });
    if (!main) return;
    const DW = desk.clientWidth, DH = desk.clientHeight, calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    for (let i = 0; i < (calm ? 1 : 9); i++) {
      const g = mkWin('見てて', { cls: 'dlg' });
      const row = el('div', 'dlg-row'), ic = el('i', 'dlg-ic'); bgi(ic, 'err'); row.append(ic, el('div', 'dlg-tx', '見てて')); g.body.append(row);
      const br = el('div', 'dlg-btns'); br.append(el('button', 'btn', '見てて')); g.body.append(br);
      g.w.style.left = clamp(Math.round(DW / 2 - 150 + i * 18), 0, Math.max(0, DW - g.w.offsetWidth)) + 'px';
      g.w.style.top = clamp(Math.round(DH / 2 - 150 + i * 16), 0, Math.max(0, DH - g.w.offsetHeight)) + 'px';
      Snd.sfx('err');
      await wait(65);
    }
    await wait(450);
    closeAll();
  }
  // 完成 → 正常終了
  async function finish() {
    await msgBox({ title: TITLE, icon: 'info', text: '作品が 完成しました。\n\n「無題.bmp」を デスクトップに 保存しました。\nATELIER.EXE を 終了します。' });
    Snd.sfx('close'); closeAll();
    openBmp();
  }

  // ── 状態の表示 ──
  function setCell(k, t, cls) {
    if (!main) return;
    const c = main.cache;
    if (c[k] !== t) { c[k] = t; main[k].textContent = t; }
    if (cls !== undefined && c[k + 'c'] !== cls) { c[k + 'c'] = cls; main[k].classList.toggle('warn', !!cls); }
  }
  const setHint = t => setCell('hint', t);
  const setMat = t => setCell('mat', t);
  const setSt = (t, w) => setCell('st', t, !!w);
  const setClock = t => setCell('ck', t);
  function setTitle(t) { setCell('tx', t || BASE); }
  function setBusy(b) { if (busy === b || !main) { busy = b; return; } busy = b; main.mb.classList.toggle('busy', b); if (b) closeMenu(); }
  function shake(on) { if (main) main.w.classList.toggle('shake', on); }

  function initPad() {
    const dp = $('dpad'), ab = $('abtn');
    let cur = null, down = false;
    const mark = (d, on) => { const b = dp.querySelector('[data-k="' + d + '"]'); if (b) b.classList.toggle('on', on); };
    const setDir = d => { if (d === cur) return; if (cur) { Input.release(cur); mark(cur, false); } cur = d; if (d) { Input.press(d); mark(d, true); } };
    const calc = e => {
      const r = dp.getBoundingClientRect(), x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(x, y) < 10) return cur;
      return Math.abs(x) > Math.abs(y) ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');
    };
    dp.addEventListener('pointerdown', e => { e.preventDefault(); Snd.unlock(); down = true; try { dp.setPointerCapture(e.pointerId); } catch (er) { /* なくても動く */ } setDir(calc(e)); });
    dp.addEventListener('pointermove', e => { if (down) setDir(calc(e)); });
    const up = () => { down = false; setDir(null); };
    dp.addEventListener('pointerup', up); dp.addEventListener('pointercancel', up); dp.addEventListener('lostpointercapture', up);
    ab.addEventListener('pointerdown', e => { e.preventDefault(); Snd.unlock(); try { ab.setPointerCapture(e.pointerId); } catch (er) { /* なくても動く */ } Input.press('act'); ab.classList.add('on'); });
    const aup = () => { Input.release('act'); ab.classList.remove('on'); };
    ab.addEventListener('pointerup', aup); ab.addEventListener('pointercancel', aup); ab.addEventListener('lostpointercapture', aup);
    ab.addEventListener('contextmenu', e => e.preventDefault()); dp.addEventListener('contextmenu', e => e.preventDefault());
  }
  function init() {
    desk = $('desk'); wins = $('wins'); pad = $('pad');
    S.touch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    mkIcons(); initPad(); refreshDesk();
    $('ico-app').addEventListener('click', () => launch());
    $('ico-readme').addEventListener('click', () => { Snd.unlock(); openReadme(); });
    $('ico-note').addEventListener('click', () => { Snd.unlock(); openNote(); });
    $('ico-bmp').addEventListener('click', () => { Snd.unlock(); openBmp(); });
    window.addEventListener('resize', fit);
    window.addEventListener('touchstart', () => { if (!S.touch) { S.touch = true; fit(); } }, { passive: true });
    window.addEventListener('blur', () => Input.clear());
    document.addEventListener('visibilitychange', () => { Snd.pause(document.hidden); Input.clear(); });
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click']) document.addEventListener(ev, () => Snd.unlock(), true);
    document.addEventListener('pointerdown', e => { if (menuEl && !menuEl.contains(e.target) && !(e.target.closest && e.target.closest('.mi'))) closeMenu(); }, true);
    window.addEventListener('keydown', e => {
      Snd.unlock();
      if (menuEl) { if (e.code === 'Escape') closeMenu(); return; }
      if (modals.length) { if (e.code === 'Escape') { const t = modals[modals.length - 1]; if (t.close) t.close(); } return; }
      if (!main) return;
      if (DEBUG) {
        if (e.code === 'F2') Game.debug('visit'); else if (e.code === 'F3') Game.debug('cone'); else if (e.code === 'F4') Game.debug('all');
      }
      const k = KEYMAP[e.code];
      if (k && !e.ctrlKey && !e.metaKey && !e.altKey) { Input.press(k); e.preventDefault(); }
    });
    window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) Input.release(k); });
  }
  return Object.assign(S, { init, launch, fit, msgBox, crash, finish, quit, openPicture, openList, openReadme, setHint, setMat, setSt, setClock, setTitle, setBusy, shake });
})();

// ── 11_main.js ──
// ───────── 起動 ─────────
function bootAll() {
  Store.load();
  buildSprites();
  Shell.init();
  Game.run();
  Shell.launch(true);   // 開いたときからタイトル画面が見えるようにしておく。音は最初の操作から。
  if (DEBUG) window.ATL = { Game, Asera, Shell, Store, Snd, PRM, Input, ROOMS, Picture };
}
const fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('16px AtelierDot', '事象のアトリエ').catch(() => {}) : Promise.resolve();
Promise.race([fontReady, wait(2500)]).then(() => { Text.clear(); bootAll(); });

})();
</script>
