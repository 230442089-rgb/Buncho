/* CALL IT: 黒い画面のまん中に、映画の帯つきの 320x240 が 1 枚。タッチ端末では下に、移動の棒とボタン 2 つ。 */
/* 見た目は 1 種類だけ（夜）。明暗テーマでは変えない。 */
:root{
  --bg:#040405; --ink:#d8d2c4; --amber:#e0a030;
  --pad:#15151a; --pad-hi:#2c2c34; --pad-on:#40404a;
  --font:"AtelierDot","DotGothic16","MS Gothic","Osaka-Mono",monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;box-sizing:border-box;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/16px var(--font);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;margin:0;border:0;padding:0;cursor:default}
[hidden]{display:none!important}
.app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center}
.cv{display:block;flex:none;width:320px;height:240px;image-rendering:crisp-edges;image-rendering:pixelated;background:#000}
.cv:focus-visible{outline:1px dotted var(--amber)}
.pad{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.stick{position:relative;width:150px;height:150px;border-radius:50%;background:var(--pad);box-shadow:inset 0 0 0 2px var(--pad-hi);pointer-events:auto;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--pad-hi);pointer-events:none}
.stick.on .knob{background:var(--pad-on)}
.btns{display:flex;align-items:flex-end;gap:10px;pointer-events:auto}
.pbtn{width:88px;height:88px;border-radius:50%;background:var(--pad);box-shadow:inset 0 0 0 2px var(--pad-hi);color:var(--ink);touch-action:none}
.pbtn.sm{width:60px;height:60px;margin-bottom:62px}
.pbtn.on{background:var(--pad-on)}
.pbtn:focus-visible{outline:1px dotted var(--amber);outline-offset:3px}

</style>
</head>
<body>
<div id="app" class="app">
  <canvas id="cv" class="cv" width="320" height="240" role="img" aria-label="CALL IT の画面"></canvas>
  <div id="pad" class="pad" hidden>
    <div id="stick" class="stick" role="group" aria-label="移動"><i id="knob" class="knob"></i></div>
    <div class="btns">
      <button type="button" id="b-bag" class="pbtn sm" aria-label="鞄を置く・拾う">鞄</button>
      <button type="button" id="b-act" class="pbtn" aria-label="決定">決定</button>
    </div>
  </div>
</div>

// ── 08_game.js ──
// ───────── ゲーム本体 ─────────
// 面白さの核: 彼は鞄へ歩いてくる。あなたのほうが速い。けれど、その場を動けない用事を済ませないと出られない。
//   危険と見返り = 用事を「もう少しだけ」続けるほど、彼は近づく。鞄を置けば身軽になり、彼を引き離せるが、取られたら終わり。
//   鍵をかければ時間を稼げるが、扉のうしろに立っていると抜けた錠に当たる。
// つかまっても、一度だけ硬貨が決める。
const Game = (() => {
  const G = {
    mode: 'boot', rt: 0, stage: 0, time: 0, P: null, S: null, steps: [], si: 0, extras: [], sub: null, subQ: [], ctx: null, cam: { x: 0, y: 0 },
    shakeT: 0, shakeA: 0, hitstop: 0, flash: 0, fx: [], beepT: 0, led: 0, F: null, fieldT: 0, menu: null, card: null, coin: null, intro: null,
    run: { quarter: false, loop: 0, total: 0 }, snapQuarter: false, objFlash: 0, can: null,
  };
  let vg = null, last = 0;
  const frameC = mkCanvas(W, H), fg = frameC.g, view = mkCanvas(W, VIEW_H), vw = view.g, lightBuf = mkCanvas(W, VIEW_H);
  const CALM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ── 字幕・ヒント ──
  function say(text, d) { G.sub = { text, t: d || 3 }; }
  function hint(id, text) { if (Store.d.hints[id]) return; Store.d.hints[id] = 1; Store.save(); say(text, 4); }
  function shake(a) { if (!CALM) { G.shakeA = a; G.shakeT = 0.3; } }
  function addFx(f) { G.fx.push(f); }

  // ── 彼の行き先（＝発信機のある所）と、そこからの道のり ──
  function goals() {
    const P = G.P, S = G.S;
    if (P.down || S.where === 'carried') return [[Math.floor(P.x), Math.floor(P.y)]];
    if (S.where === 'vent') return World.ventAccess(S.vent);

  }

  // ── 夜のはじまり ──
  function startStage(i) {

    G.stage = i; G.snapQuarter = G.run.quarter;
    World.load(def, i);
    const m = World.marks.start;
    G.P = { x: m.x + 0.5, y: m.y + 0.5, dir: 'down', carrying: true, stamina: 1, stDelay: 0, running: false, wound: 0, down: false, moving: false, anim: 0, stepT: 0, hold: null, holdT: 0, fumble: 0, fumbleDoor: null, busy: 0, items: {}, quarter: G.run.quarter };

    G.extras = (def.extras || []).map(s => Object.assign({ prog: 0, done: false, tick: 0 }, s));
    G.can = World.marks.can ? { x: World.marks.can.x + 0.5, y: World.marks.can.y + 0.5 } : null;
    G.time = 0; G.fx = []; G.sub = null; G.subQ = def.intro.slice(); G.shakeT = 0; G.hitstop = 0; G.flash = 0; G.beepT = 0; G.led = 0; G.ctx = null; G.card = null; G.coin = null; G.menu = null;

  // ── あなた ──
  function moveAxis(P, dx, dy) {

    if (!World.blocked(nx, ny, r)) { P.x = nx; P.y = ny; return; }
    // 扉にぶつかったら開ける。自分でかけた鍵は、開けるのに少し手間どる
    const d = World.doorAt(Math.floor(P.x + Math.sign(dx) * (r + 0.12 + Math.abs(dx))), Math.floor(P.y + Math.sign(dy) * (r + 0.12 + Math.abs(dy))));

    if (!mv) { P.moving = false; return; }
    const sp = PRM.walk * (P.carrying ? PRM.carryMul : 1) * (P.running ? PRM.runMul : 1) * (P.wound > 0 ? PRM.woundMul : 1) * World.slowAt(P.x, P.y);

      const a = clamp(Math.min(G.intro.t / 0.5, (G.intro.d - G.intro.t) / 0.5), 0, 1);
      g.globalAlpha = a; Text.draw(g, G.intro.lines[0], W / 2, 92, '#e0a030', { align: 'center' }); Text.draw(g, G.intro.lines[1], W / 2, 116, '#e8e0d0', { align: 'center', scale: 2 }); g.globalAlpha = 1;
    } else if (m === 'coin') drawCoin(g);
    else if (m === 'dead' || m === 'clear') {
      const n = G.card.lines.length;
      centred(g, G.card.lines, 96 - n * 11, m === 'clear' ? '#e8e0d0' : '#b8b0a0');
      if (G.card.t > 0.9) drawMenu(g, G.card.menu, 168);
    } else {
      renderWorld(); g.drawImage(view.c, 0, VIEW_Y); drawHud(g);
      if (m === 'pause') { g.globalAlpha = 0.72; R(g, 0, VIEW_Y, W, VIEW_H, '#000'); g.globalAlpha = 1; Text.draw(g, '中断', W / 2, 62, '#e0a030', { align: 'center' }); drawMenu(g, G.menu, 96); }
    }
    FX.levels = 20; FX.desat = m === 'play' || m === 'pause' ? (G.P.down ? 0.7 : G.P.wound > 0 ? 0.35 : 0.08) : 0; FX.glitch = 0; FX.invert = false;
    postFX(g, vg);
  }
  // 画面をさわったとき（画面の中の座標）
  function pointer(x, y) {
    const m = G.mode, menu = m === 'title' || m === 'help' || m === 'pause' ? G.menu : (m === 'dead' || m === 'clear') && G.card.t > 0.9 ? G.card.menu : null;
    if (menu) { menu.items.forEach((it, i) => { if (it.r && x >= it.r[0] && y >= it.r[1] && x < it.r[0] + it.r[2] && y < it.r[1] + it.r[3]) { menu.sel = i; Snd.sfx('ui'); it.fn(); } }); return; }
    if (m === 'coin') callIt(x < W / 2 ? '表' : '裏');
    else if (m === 'intro') { if (G.intro.t > 0.4) G.mode = 'play'; }
    else if (m === 'play' && y < VIEW_Y && x > W - 60) pause();
  }
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    Input.update(); G.rt += dt;
    if (vg && G.mode !== 'boot') { update(dt); render(); }
    Input.endFrame();
    requestAnimationFrame(frame);
  }
  function init(canvas) { vg = canvas.getContext('2d'); vg.imageSmoothingEnabled = false; }
  function go() { last = performance.now(); requestAnimationFrame(frame); }
  // 試験用: 1/60 秒ぶんだけ進める（#debug のとき、外から呼ぶ）
  function sim(n) { for (let i = 0; i < n && G.mode === 'play'; i++) updPlay(1 / 60); }
  return Object.assign(G, { init, go, title, startStage, retry, say, shake, addFx, refield, hitPlayer, capture, lostMoney, pointer, callIt, sim });
})();

// ── 09_main.js ──
// ───────── 起動と、入力のつなぎこみ ─────────
function boot() {
  Store.load(); Art.build(); Snd.mute(!!Store.d.mute);
  const $ = id => document.getElementById(id), cv = $('cv'), app = $('app'), pad = $('pad'), stick = $('stick'), knob = $('knob');
  let touch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  // 画面に入るいちばん大きな倍率にする。ドットがそろう倍率（端末の画素の整数倍）を優先
  function fit() {
    pad.hidden = !touch;
    const AW = app.clientWidth, AH = app.clientHeight, dpr = window.devicePixelRatio || 1;
    const side = touch && AW > AH * 1.3, padH = touch && !side ? 172 : 0, padW = side ? 340 : 0;
    const fitS = Math.min((AW - padW) / W, (AH - padH) / H);
    let s = Math.floor(fitS * dpr) / dpr;
    if ((s < fitS * 0.88 || s <= 0) && (dpr >= 1.5 || fitS < 1)) s = fitS >= 1 ? Math.floor(fitS * 4) / 4 : Math.floor(fitS * 100) / 100;
    s = clamp(s, 0.4, 6);
    cv.style.width = Math.round(W * s * dpr) / dpr + 'px'; cv.style.height = Math.round(H * s * dpr) / dpr + 'px';
    cv.style.marginTop = Math.max(0, Math.round((AH - padH - H * s) / 2)) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('touchstart', () => { if (!touch) { touch = true; fit(); } }, { passive: true });
  window.addEventListener('blur', () => Input.clear());
  document.addEventListener('visibilitychange', () => { Snd.pause(document.hidden); Input.clear(); });
  for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) document.addEventListener(ev, () => Snd.unlock(), true);
  window.addEventListener('keydown', e => { const k = Input.KEYS[e.code]; if (k && !e.ctrlKey && !e.metaKey && !e.altKey) { Input.press(k); e.preventDefault(); } });
  window.addEventListener('keyup', e => { const k = Input.KEYS[e.code]; if (k) { Input.release(k); e.preventDefault(); } });
  cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect(); Game.pointer((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  // 移動の棒。大きく倒すと走る。メニューでは上下左右のひと押しになる
  let sid = null, nav = null;
  const setStick = e => {
    const r = stick.getBoundingClientRect(), R0 = 46;
    let x = (e.clientX - (r.left + r.width / 2)) / R0, y = (e.clientY - (r.top + r.height / 2)) / R0;
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    Input.stick.on = true; Input.stick.x = x; Input.stick.y = y;
    knob.style.transform = 'translate(' + Math.round(x * R0) + 'px,' + Math.round(y * R0) + 'px)';
    const d = m < 0.5 ? null : Math.abs(x) > Math.abs(y) ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');
    if (d !== nav) { nav = d; if (d) { Input[d + 'Hit'] = true; Input.anyHit = true; } }
  };
  const endStick = () => { sid = null; nav = null; Input.stick.on = false; Input.stick.x = Input.stick.y = 0; knob.style.transform = ''; stick.classList.remove('on'); };
  stick.addEventListener('pointerdown', e => { e.preventDefault(); sid = e.pointerId; stick.classList.add('on'); try { stick.setPointerCapture(e.pointerId); } catch (er) { /* なくても動く */ } setStick(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === sid) setStick(e); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) stick.addEventListener(ev, endStick);
  stick.addEventListener('contextmenu', e => e.preventDefault());
  for (const [id, k] of [['b-act', 'act'], ['b-bag', 'bag']]) {
    const b = $(id), up = () => { Input.release(k); b.classList.remove('on'); };
    b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (er) { /* なくても動く */ } Input.press(k); b.classList.add('on'); });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  }
  fit();
  Game.init(cv); Game.title(); Game.go();
  if (DEBUG) window.ATL = { Game, Anton, World, Snd, PRM, Input, Store, STAGES, Art };
}
const fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('16px AtelierDot', 'CALL IT 表か裏か').catch(() => {}) : Promise.resolve();
Promise.race([fontReady, wait(2500)]).then(() => { Text.clear(); boot(); });

})();
