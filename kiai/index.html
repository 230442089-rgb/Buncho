<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>気合い</title>
<style>
@font-face { font-family: 'Shippori Mincho'; src: url('../film/fonts/ShipporiMincho-Medium.ttf'); font-weight: 500; }
@font-face { font-family: 'Shippori Mincho'; src: url('../film/fonts/ShipporiMincho-SemiBold.ttf'); font-weight: 600; }
@font-face { font-family: 'Shippori Mincho'; src: url('../film/fonts/ShipporiMincho-Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'Shippori Mincho'; src: url('../film/fonts/ShipporiMincho-ExtraBold.ttf'); font-weight: 800; }
@font-face { font-family: 'Noto Sans JP'; src: url('../film/fonts/NotoSansJP-VF.ttf'); font-weight: 100 900; }
@font-face { font-family: 'Dela Gothic One'; src: url('fonts/DelaGothicOne-Regular.ttf'); font-weight: 400; }
@font-face { font-family: 'Reggae One'; src: url('fonts/ReggaeOne-Regular.ttf'); font-weight: 400; }
:root {
  --paper: #eef1f4; --ink: #04060b; --blue: #58b8ff; --gold: #ffb23a; --red: #ff3b2a; --soul: #c9f1ff; --dim: rgba(238, 241, 244, .66);
  --mincho: 'Shippori Mincho', serif; --gothic: 'Noto Sans JP', sans-serif; --dela: 'Dela Gothic One', 'Noto Sans JP', sans-serif; --reggae: 'Reggae One', 'Noto Sans JP', sans-serif;
}
html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
#gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
#overlay { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; color: var(--paper);
  font-family: var(--mincho); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-kerning: normal; }
#overlay > div { position: absolute; }
.ch { display: inline-block; white-space: pre; }
b, i, em { font-style: normal; font-weight: inherit; }

/* 語りの一行（中央下。2 行まで） */
.narr { left: 0; right: 0; top: 858px; padding-top: 26px; padding-bottom: 30px; text-align: center;
  background: radial-gradient(ellipse 44% 62% at 50% 50%, rgba(0, 3, 10, .66), rgba(0, 3, 10, .4) 55%, rgba(0, 3, 10, 0) 100%); font-family: var(--mincho); font-weight: 600; font-size: 48px; line-height: 70px;
  letter-spacing: 0.12em; padding-left: 0.12em; font-feature-settings: 'palt' 1; white-space: nowrap;
  text-shadow: 0 0 26px rgba(0, 0, 0, .95), 0 0 10px rgba(0, 0, 0, .9), 0 2px 10px rgba(0, 0, 0, .8), 0 0 3px rgba(0, 0, 0, .9); }
.narr.two { top: 812px; }
.narr.mid { top: 500px; font-size: 58px; }
.narr b { color: #8fd2ff; } .narr em { color: var(--gold); } .narr i { color: var(--red); } .narr u { text-decoration: none; color: var(--soul); }
.sub { left: 0; right: 0; text-align: center; font-family: var(--gothic); font-weight: 400; font-size: 27px; line-height: 40px; letter-spacing: 0.1em; color: var(--dim); white-space: nowrap;
  text-shadow: 0 0 14px rgba(0, 0, 0, .95), 0 0 4px rgba(0, 0, 0, .9); }
.lbl { font-family: var(--gothic); font-weight: 500; font-size: 27px; line-height: 38px; letter-spacing: 0.1em; white-space: nowrap; text-shadow: 0 0 12px rgba(0, 0, 0, .95), 0 0 3px rgba(0, 0, 0, .9); }
.lbl small { display: block; font-weight: 400; font-size: 21px; letter-spacing: 0.08em; color: rgba(238, 241, 244, .72); line-height: 31px; }
.lbl.r { text-align: right; } .lbl.c { text-align: center; transform: translateX(-50%); }
.lbl b { color: var(--blue); } .lbl em { color: var(--gold); } .lbl i { color: var(--red); }

/* 叫びの文字 */
.slam { font-family: var(--dela); white-space: nowrap; line-height: 1; transform-origin: 50% 50%; }
.slam .c { display: inline-block; position: relative; transform-origin: 50% 60%; will-change: transform;
  color: #fff7e0; -webkit-text-stroke: 0.045em #1a0300; paint-order: stroke fill;
  text-shadow: 0 0 0.10em rgba(255, 190, 70, .95), 0.035em 0.045em 0 #c81e00, 0.07em 0.09em 0 #5a0900, 0 0 0.5em rgba(255, 90, 10, .55); }
.slam.soul .c { color: #ffffff; -webkit-text-stroke: 0.045em #021426;
  text-shadow: 0 0 0.10em rgba(190, 240, 255, .95), 0.035em 0.045em 0 #2b8fd6, 0.07em 0.09em 0 #06305c, 0 0 0.5em rgba(90, 190, 255, .55); }
.slam.v { writing-mode: vertical-rl; }
.slam .c.o { color: transparent; -webkit-text-stroke: 0.03em #eaf8ff; text-shadow: 0 0 0.22em rgba(110, 200, 255, .85); }
.slam.blue .c { color: #e9f6ff; -webkit-text-stroke: 0.04em #00122e; text-shadow: 0 0 0.12em rgba(120, 200, 255, .95), 0.03em 0.04em 0 #0a52c8, 0 0 0.5em rgba(40, 120, 255, .6); }
.slam.red .c { color: #ffe9e4; -webkit-text-stroke: 0.045em #1c0000; text-shadow: 0 0 0.10em rgba(255, 90, 70, .9), 0.035em 0.045em 0 #b00000, 0.07em 0.09em 0 #400000, 0 0 0.5em rgba(255, 20, 10, .5); }
/* 筆文字ふうの一言（耐える など） */
.stamp { font-family: var(--reggae); white-space: nowrap; line-height: 1.05; color: #fff3d6; -webkit-text-stroke: 0.03em #1a0600; paint-order: stroke fill;
  text-shadow: 0 0 0.12em rgba(255, 180, 60, .9), 0.03em 0.04em 0 #a32a00, 0 0 0.6em rgba(255, 110, 10, .45); transform-origin: 50% 50%; }
.stamp.v { writing-mode: vertical-rl; }
.stamp.cold { color: #eaf4ff; -webkit-text-stroke: 0.03em #000a1c; text-shadow: 0 0 0.12em rgba(110, 190, 255, .9), 0.03em 0.04em 0 #0b3d91, 0 0 0.6em rgba(30, 110, 255, .5); }
.stamp.red { color: #ffe6e0; -webkit-text-stroke: 0.03em #1c0000; text-shadow: 0 0 0.12em rgba(255, 80, 60, .9), 0.03em 0.04em 0 #9a0000, 0 0 0.6em rgba(255, 20, 10, .5); }

/* 線量計（右上） */
.dose { right: 72px; top: 50px; width: 430px; text-align: right; white-space: nowrap; text-shadow: 0 0 16px rgba(0, 0, 0, .9), 0 0 4px rgba(0, 0, 0, .9); }
.dose .cap { font-family: var(--gothic); font-weight: 500; font-size: 25px; letter-spacing: 0.22em; color: var(--dim); }
.dose .num { font-family: var(--dela); font-size: 88px; line-height: 96px; letter-spacing: 0.01em; color: #dff1ff; font-feature-settings: 'tnum' 1; text-shadow: 0 0 24px rgba(60, 150, 255, .75), 0 0 6px rgba(0, 0, 0, .9); }
.dose .num .u { font-family: var(--gothic); font-weight: 700; font-size: 38px; letter-spacing: 0.06em; margin-left: 12px; }
.dose .bar { height: 8px; background: rgba(255, 255, 255, .14); margin-top: 2px; position: relative; overflow: hidden; }
.dose .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; background: linear-gradient(90deg, #58b8ff, #ff3b2a); }
.dose .note { font-family: var(--gothic); font-weight: 500; font-size: 25px; line-height: 38px; letter-spacing: 0.1em; margin-top: 10px; color: #ffd0c8; }
.dose.hot .num { color: #ffe1dc; text-shadow: 0 0 26px rgba(255, 50, 30, .85), 0 0 6px rgba(0, 0, 0, .9); }

/* 気合いの計器（左上） */
.kiai { left: 72px; top: 50px; width: 400px; white-space: nowrap; text-shadow: 0 0 16px rgba(0, 0, 0, .9), 0 0 4px rgba(0, 0, 0, .9); }
.kiai .cap { font-family: var(--gothic); font-weight: 500; font-size: 25px; letter-spacing: 0.22em; color: var(--dim); }
.kiai .num { font-family: var(--dela); font-size: 76px; line-height: 90px; color: #fff0c9; text-shadow: 0 0 24px rgba(255, 150, 30, .8), 0 0 6px rgba(0, 0, 0, .9); font-feature-settings: 'tnum' 1; }
.kiai .num .u { font-family: var(--gothic); font-weight: 700; font-size: 38px; margin-left: 8px; }
.kiai .bar { height: 16px; background: rgba(255, 255, 255, .12); position: relative; margin-top: 4px; }
.kiai .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; background: linear-gradient(90deg, #ff7a18, #ffe27a); box-shadow: 0 0 18px rgba(255, 160, 40, .8); }
.kiai.soul .num { color: #f2fbff; text-shadow: 0 0 24px rgba(120, 210, 255, .85), 0 0 6px rgba(0, 0, 0, .9); }
.kiai.soul .bar i { background: linear-gradient(90deg, #58b8ff, #ffffff); box-shadow: 0 0 18px rgba(140, 220, 255, .9); }

/* 細胞・DNA の場面の数字（左上） */
.cnt { left: 96px; top: 76px; white-space: nowrap; font-family: var(--gothic); text-shadow: 0 0 14px rgba(0, 0, 0, .95), 0 0 4px rgba(0, 0, 0, .9); }
.cnt .row { display: flex; align-items: baseline; height: 78px; }
.cnt .k { font-weight: 500; font-size: 27px; letter-spacing: 0.2em; color: var(--dim); width: 150px; }
.cnt .v { font-family: var(--dela); font-size: 62px; letter-spacing: 0.02em; font-feature-settings: 'tnum' 1; min-width: 420px; }
.cnt .v.b { color: #bfe3ff; } .cnt .v.g { color: #ffe3a0; } .cnt .v.r { color: #ff9a8c; } .cnt .v.s { color: #e8faff; }

/* 小さな注意書き・札 */
.notice { left: 0; right: 0; text-align: center; font-family: var(--gothic); font-weight: 500; font-size: 30px; letter-spacing: 0.14em; color: rgba(255, 255, 255, .9); white-space: nowrap; }
.notice span { display: inline-block; padding: 14px 34px; border: 2px solid rgba(255, 255, 255, .7); background: rgba(0, 0, 0, .72); }
.card { left: 0; right: 0; text-align: center; font-family: var(--mincho); font-weight: 600; font-size: 60px; line-height: 92px; letter-spacing: 0.14em; white-space: nowrap;
  text-shadow: 0 0 26px rgba(0, 0, 0, .95), 0 0 10px rgba(0, 0, 0, .9); }
.card small { font-size: 0.62em; color: var(--dim); letter-spacing: 0.12em; }
.title { left: 0; right: 0; top: 120px; text-align: center; }
.title .t { font-family: var(--dela); font-size: 250px; line-height: 270px; letter-spacing: 0.06em; padding-left: 0.06em; color: #fff7e0; -webkit-text-stroke: 8px #1a0300; paint-order: stroke fill;
  text-shadow: 0 0 26px rgba(255, 180, 60, .9), 9px 11px 0 #c81e00, 17px 21px 0 #5a0900, 0 0 110px rgba(255, 90, 10, .5); }
.title .te { font-family: var(--gothic); font-weight: 700; font-size: 30px; letter-spacing: 0.9em; padding-left: 0.9em; color: var(--dim); margin-top: 6px; }
.disc { left: 0; right: 0; top: 512px; text-align: center; font-family: var(--gothic); font-weight: 500; font-size: 35px; line-height: 60px; letter-spacing: 0.08em; white-space: nowrap; color: rgba(238, 241, 244, .94); }
.disc b { color: #ffd166; font-weight: 700; }
.credit { left: 0; right: 0; top: 770px; text-align: center; font-family: var(--gothic); font-weight: 400; font-size: 23px; line-height: 38px; letter-spacing: 0.07em; color: rgba(238, 241, 244, .62); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="overlay"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
