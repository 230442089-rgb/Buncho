<div id="desk" class="desk">
  <div id="icons" class="icons">
    <button type="button" class="dicon" id="ico-app"><i></i><span>ATELIER.EXE</span></button>
    <button type="button" class="dicon" id="ico-readme"><i></i><span>よんでね.txt</span></button>
    <button type="button" class="dicon" id="ico-note" hidden><i></i><span>みてて.txt</span></button>
    <button type="button" class="dicon" id="ico-bmp" hidden><i></i><span>無題.bmp</span></button>
  </div>
  <div id="wins"></div>
  <div id="pad" class="pad" hidden>
    <div id="dpad" class="dpad" role="group" aria-label="十字ボタン">
      <div class="pb up" data-k="up">▲</div>
      <div class="pb lf" data-k="left">←</div>

      <div class="pb rt" data-k="right">→</div>
      <div class="pb dn" data-k="down">▼</div>
    </div>
    <button type="button" id="abtn" class="abtn" aria-label="決定">Ａ</button>
  </div>
</div>
