<title>主権留保</title>
<meta name="description" content="久世躁一郎が主人公の諜報アドベンチャー。第一章「微笑む課長」、第二章「二つの顔」、第三章「人間の代表」。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 全面の3D舞台に、官庁の書類と判子の語彙で作った字幕・手帳・報告書を重ねる。夜の青灰で統一した単色の画面。 */
:root {
  --night: #121826;    /* 背景の夜 */
  --slate: #1C2434;    /* 書類の裏紙 */
  --line: #34405A;     /* 罫 */
  --paper: #EEF0F3;    /* 書類の白 */
  --ink: #E9EDF4;      /* 文字 */
  --mute: #9AA6BC;     /* 注記 */
  --stamp: #C8323C;    /* 判子の朱 */
  --gold: #E3B428;     /* 陽盾の金（ユリアの色） */
  --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; transition: filter .5s; }
body.ura #stage canvas { filter: grayscale(.85) contrast(1.25) brightness(.7); }
#uraVeil { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 35%, rgba(90,0,10,.55) 100%); }
body.ura #uraVeil { opacity: 1; }
#layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); font-size: 11.5px; font-weight: 900; padding: 2px 8px; border-radius: 4px; background: rgba(18,24,38,.82); color: var(--ink); white-space: nowrap; border: 1px solid var(--line); }
.pop { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 14px; color: var(--ink); text-shadow: 0 1px 3px #000; white-space: nowrap; animation: rise 1.2s ease-out forwards; }
.pop.down { color: #FF8A92; } .pop.up { color: #9FE3C0; }
@keyframes rise { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: 0 -40px; } }

/* HUD */
#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
#hud > * { pointer-events: auto; }
#obj { max-width: min(62vw, 420px); background: rgba(18,24,38,.86); border-left: 4px solid var(--stamp); padding: 6px 10px 7px; }
#obj small { display: block; font-size: 10px; letter-spacing: .2em; color: var(--mute); font-weight: 900; }
#obj b { display: block; font-size: 13.5px; line-height: 1.45; font-weight: 700; }
#place { font-family: var(--mincho); font-size: 12px; color: var(--mute); margin-top: 2px; }
.meters { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.meter { background: rgba(18,24,38,.86); padding: 5px 9px; min-width: 132px; }
.meter .lb { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 900; letter-spacing: .1em; color: var(--mute); }

.bar i { display: block; height: 100%; width: 100%; background: var(--paper); transition: width .3s; }
#detM .bar i { background: var(--stamp); transition: none; }
#noteBtn { border: 1px solid var(--line); background: rgba(18,24,38,.86); padding: 6px 10px; font-size: 12.5px; font-weight: 700; }
.hbtns { display: flex; gap: 6px; }
#saveBtn { border: 1px solid var(--line); background: rgba(18,24,38,.86); padding: 6px 10px; font-size: 12.5px; font-weight: 700; }
#autoSave { position: fixed; left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 46px); z-index: 9; font-size: 11.5px; font-weight: 700; color: var(--ink); background: rgba(18,24,38,.86); border-left: 3px solid var(--gold); padding: 3px 9px; opacity: 0; pointer-events: none; }

#prompt { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); transform: translateX(-50%); background: rgba(18,24,38,.88); border: 1px solid var(--line); padding: 5px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; pointer-events: none; }
#prompt kbd { font-family: var(--body); border: 1px solid var(--mute); border-radius: 3px; padding: 0 5px; margin-right: 6px; font-size: 11px; }
#holdRing { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 186px); width: 120px; height: 6px; transform: translateX(-50%); background: #2A3348; pointer-events: none; }
#holdRing i { display: block; height: 100%; width: 0; background: var(--stamp); }

/* 操作 */
#stickBase { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(233,237,244,.5); background: rgba(18,24,38,.25); pointer-events: none; z-index: 3; }
#stickKnob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(233,237,244,.85); }
#act { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 18px); bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); width: 92px; height: 92px; border-radius: 50%; border: 2px solid var(--paper); background: rgba(200,50,60,.9); color: #fff; font-weight: 900; font-size: 15px; z-index: 4; line-height: 1.2; }
#act.dim { background: rgba(52,64,90,.85); }
#hint { position: fixed; left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); font-size: 11px; color: var(--mute); background: rgba(18,24,38,.7); padding: 4px 8px; pointer-events: none; max-width: 56vw; line-height: 1.5; }

/* 台詞 */
#dlg { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); width: min(94vw, 760px); background: rgba(14,19,30,.94); border-top: 3px solid var(--paper); padding: 12px 16px 14px; z-index: 10; cursor: pointer; min-height: 104px; }

#dName { font-family: var(--mincho); font-weight: 800; font-size: 15px; margin-bottom: 4px; min-height: 1em; letter-spacing: .06em; }
#dText { font-size: 15.5px; line-height: 1.8; font-weight: 500; white-space: pre-line; }
#dlg.narr #dText { font-family: var(--mincho); font-weight: 600; color: #D6DCE8; }
#dlg.ura #dText { font-family: var(--mincho); font-weight: 800; color: #FFD6D9; }
#dNext { position: absolute; right: 14px; bottom: 8px; font-size: 11px; color: var(--mute); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
#choices { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); transform: translateX(-50%); width: min(94vw, 680px); display: grid; gap: 8px; z-index: 11; }
#choices button { text-align: left; background: rgba(238,240,243,.96); color: #141A28; border: 0; border-left: 6px solid #6A7690; padding: 10px 14px; font-size: 14.5px; font-weight: 700; line-height: 1.55; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; }
#choices button .k { font-size: 10.5px; font-weight: 900; letter-spacing: .12em; color: #6A7690; white-space: nowrap; }
#choices button.ura { border-left-color: var(--stamp); }
#choices button.ura .k { color: var(--stamp); }
#choices button.warm { border-left-color: #3A8A6A; } #choices button.warm .k { color: #2E7A5A; }
#choices button:hover { background: #fff; }

/* 電話・字幕カード */
#phone { position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; background: rgba(6,8,14,.55); padding: 16px; }
#phone .ph { width: min(300px, 86vw); background: #0B0E15; border: 2px solid #3A4458; border-radius: 26px; padding: 22px 16px 26px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
#phone .bar2 { font-size: 11px; color: var(--mute); text-align: center; margin-bottom: 14px; font-variant-numeric: tabular-nums; }
#phone .from { font-size: 12px; font-weight: 900; color: var(--mute); margin-bottom: 6px; }
#phone .msg { background: #232B3C; border-radius: 4px 14px 14px 14px; padding: 10px 12px; font-size: 14px; line-height: 1.7; white-space: pre-line; }
#phone .tap { text-align: center; font-size: 11px; color: var(--mute); margin-top: 16px; }
#card { position: fixed; inset: 0; z-index: 20; background: #05070B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; opacity: 0; transition: opacity .7s; pointer-events: none; }
#card.on { opacity: 1; pointer-events: auto; }
#card h2 { margin: 0; font-family: var(--mincho); font-weight: 800; font-size: clamp(22px, 5vw, 40px); letter-spacing: .12em; text-wrap: balance; }
#card p { margin: 0; font-family: var(--mincho); font-size: 14px; color: var(--mute); letter-spacing: .2em; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s; z-index: 15; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); background: var(--paper); color: #141A28; padding: 6px 14px; font-size: 13px; font-weight: 700; z-index: 9; pointer-events: none; border-left: 5px solid var(--stamp); max-width: 90vw; }

/* 手帳 */
#note { position: fixed; inset: 0; z-index: 16; background: rgba(6,8,14,.7); display: flex; align-items: center; justify-content: center; padding: 16px; }
#note .book { width: 100%; max-width: 620px; max-height: 100%; overflow-y: auto; background: var(--paper); color: #141A28; padding: 18px 20px 20px; display: grid; gap: 10px; }
#note h2 { margin: 0; font-family: var(--mincho); font-size: 20px; }
.nh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.nh button { border: 1px solid #141A28; background: transparent; padding: 5px 12px; font-weight: 700; color: #141A28; }
.ni { border-top: 1px solid #C8CDD6; padding-top: 8px; }
.ni b { font-size: 14px; } .ni p { margin: 3px 0 0; font-size: 13px; line-height: 1.7; color: #3A4256; }
.chip { display: inline-block; font-size: 10px; font-weight: 900; padding: 1px 6px; margin-right: 6px; border: 1.5px solid var(--stamp); color: var(--stamp); vertical-align: 1px; letter-spacing: .1em; }
.empty { color: #6A7690; font-size: 13px; }

/* タイトル */
#title { position: fixed; inset: 0; z-index: 18; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 16px calc(env(safe-area-inset-bottom, 0px) + 28px); background: linear-gradient(to bottom, rgba(5,7,11,0) 0%, rgba(5,7,11,.15) 35%, rgba(5,7,11,.9) 80%); }
.tbox { width: 100%; max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.tbox .eye { font-size: 11px; letter-spacing: .3em; color: var(--mute); font-weight: 900; }
.tbox h1 { margin: 0; font-family: var(--mincho); font-weight: 800; font-size: clamp(48px, 13vw, 96px); line-height: 1; letter-spacing: .08em; color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,.6); }
.tbox .sub { font-family: var(--mincho); font-size: clamp(16px, 4vw, 22px); letter-spacing: .2em; }
.tbox .ch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-family: var(--mincho); font-size: 15px; }
.tbox .ch i { font-style: normal; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.tbox .ch span { border: 1.5px solid var(--stamp); color: var(--stamp); padding: 2px 8px; font-size: 12px; font-family: var(--body); font-weight: 900; letter-spacing: .1em; }
.tbox p { margin: 0; font-size: 13px; line-height: 1.8; color: #C9D0DE; max-width: 60ch; }
.trow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.go { border: 0; background: var(--paper); color: #141A28; font-family: var(--mincho); font-weight: 800; font-size: 18px; padding: 12px 28px; letter-spacing: .2em; }
.go:hover { background: #fff; }
.ghost { border: 1px solid var(--line); background: rgba(18,24,38,.6); padding: 9px 14px; font-size: 13px; font-weight: 700; }
.ghost[aria-pressed="true"] { border-color: var(--paper); }
.cinfo { font-size: 12px; color: var(--mute); margin-top: -6px; }
/* 真のタイトルが明かされたあと */
#title.rev h1 { font-weight: 800; letter-spacing: .16em; font-size: clamp(46px, 12.5vw, 112px); line-height: 1.1; padding-top: .14em; }
#title.rev h1::after { content: ""; display: block; width: min(70%, 420px); height: 3px; background: var(--stamp); margin-top: 12px; }
#title.rev .eye { color: var(--stamp); }
.keys { font-size: 11.5px; color: var(--mute); line-height: 1.7; }

/* 報告書 */
#report { position: fixed; inset: 0; z-index: 19; background: rgba(5,7,11,.92); display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
.doc { width: 100%; max-width: 600px; background: var(--paper); color: #141A28; padding: 22px 22px 20px; position: relative; display: grid; gap: 10px; margin: auto; }
.doc .stamps { position: absolute; right: 18px; top: 16px; display: flex; gap: 6px; }
.doc .stamps span { border: 3px solid var(--stamp); color: var(--stamp); font-family: var(--mincho); font-weight: 800; font-size: 18px; padding: 2px 8px; transform: rotate(-8deg); }
.doc h2 { margin: 0; font-family: var(--mincho); font-size: 22px; }
.doc .meta { font-size: 12px; color: #4A5468; }
.doc table { width: 100%; border-collapse: collapse; font-size: 13px; }
.doc td { color: #141A28; border-top: 1px solid #C8CDD6; padding: 6px 4px; vertical-align: top; line-height: 1.6; }
.doc td:first-child { white-space: nowrap; font-weight: 900; width: 7.5em; color: #2A3348; }
.doc .ev { display: grid; gap: 2px; }
.doc .ev .no { color: #6A7388; }
.doc .close { font-family: var(--mincho); font-size: 14px; line-height: 1.8; border-left: 4px solid var(--stamp); padding-left: 10px; }
.doc .trow .go { background: #141A28; color: #fff; font-size: 15px; padding: 10px 20px; }
.doc .trow .ghost { color: #141A28; border-color: #141A28; background: transparent; }
#loc { position: fixed; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px); z-index: 8; pointer-events: none; opacity: 0; transition: opacity .8s; max-width: calc(100vw - 32px); }
#loc.on { opacity: 1; }
#loc small { display: block; font-size: 11px; letter-spacing: .3em; color: var(--mute); font-weight: 900; }
#loc b { display: block; font-family: var(--mincho); font-weight: 800; font-size: clamp(20px, 4.4vw, 34px); letter-spacing: .1em; color: #fff; text-shadow: 0 2px 16px rgba(0,0,0,.7); }
#loc i { display: block; font-style: normal; font-size: 11px; letter-spacing: .24em; color: #C9D0DE; margin-top: 4px; }
#nameCard { position: fixed; right: 16px; top: 22%; z-index: 8; width: min(340px, calc(100vw - 32px)); background: rgba(10,13,22,.86); border-left: 5px solid var(--gold); padding: 12px 14px; pointer-events: none; opacity: 0; transform: translateX(12px); transition: opacity .4s, transform .4s; }
#nameCard.on { opacity: 1; transform: none; }
#nameCard small { display: block; font-size: 10.5px; letter-spacing: .2em; color: var(--mute); font-weight: 900; }
#nameCard b { display: block; font-family: var(--mincho); font-weight: 800; font-size: 28px; line-height: 1.2; margin-top: 2px; }
#nameCard em { display: block; font-style: normal; font-size: 12.5px; font-weight: 700; margin-top: 4px; color: var(--gold); }
#nameCard p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.7; color: #D6DCE8; white-space: pre-line; }
#skipBtn { position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 14px); z-index: 21; border: 1px solid var(--line); background: rgba(10,13,22,.8); padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--mute); }
/* 名乗り：組織の本当の名と、真のタイトル */
#reveal { position: fixed; inset: 0; z-index: 22; background: #030406; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; overflow: hidden; cursor: pointer; transition: opacity .6s; }
#reveal.out { opacity: 0; }
#reveal.quake > .org, #reveal.quake > .ttl { animation: quake .55s; }
@keyframes quake { 0%, 100% { translate: 0 0; } 15% { translate: -14px 8px; } 35% { translate: 11px -9px; } 55% { translate: -7px 5px; } 75% { translate: 4px -3px; } }
#rvFlash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#rvFlash.go { animation: flash .8s ease-out; }
@keyframes flash { from { opacity: .95; } to { opacity: 0; } }
#reveal .tap { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); font-size: 12px; color: var(--mute); letter-spacing: .2em; opacity: 0; transition: opacity .6s; }
#reveal.ready .tap { opacity: 1; }
#reveal .org { display: grid; gap: 14px; justify-items: center; opacity: 0; transform: scale(1.7); filter: blur(14px); }
#reveal.on .org { animation: slam .5s cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes slam { to { opacity: 1; transform: none; filter: none; } }
#reveal .org small { font-size: 13px; letter-spacing: .8em; margin-right: -.8em; color: #C9D0DE; font-weight: 900; }
#reveal .org b { font-family: var(--mincho); font-weight: 800; font-size: clamp(64px, 19vw, 190px); line-height: 1; letter-spacing: .14em; color: #fff; border: clamp(4px, 1vw, 8px) solid var(--stamp); padding: .1em .06em .12em .2em; }
#reveal .org i { font-style: normal; font-family: var(--mincho); font-weight: 600; font-size: clamp(14px, 3.4vw, 20px); letter-spacing: .3em; color: #D6DCE8; }
#reveal .org em { font-style: normal; font-size: 12.5px; color: var(--mute); letter-spacing: .2em; opacity: 0; animation: fadeIn .8s 1.1s forwards; }
@keyframes fadeIn { to { opacity: 1; } }
#reveal .ttl { position: relative; width: 100%; max-width: 900px; min-height: 260px; display: grid; place-items: center; }
#reveal .old { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity 1.2s; }
#reveal.pre .old { opacity: 1; }
#reveal .old span { grid-area: 1 / 1; font-family: var(--mincho); font-weight: 800; font-size: clamp(48px, 13vw, 110px); letter-spacing: .08em; color: #E9EDF4; transition: transform .7s cubic-bezier(.3,.1,.2,1), opacity .7s; }
#reveal .old .o1 { clip-path: inset(0 0 50% 0); } #reveal .old .o2 { clip-path: inset(50% 0 0 0); }
#reveal.split .old .o1 { transform: translate(-22%, -40%) rotate(-4deg); opacity: 0; }
#reveal.split .old .o2 { transform: translate(22%, 40%) rotate(3deg); opacity: 0; }
#reveal .nw { display: grid; gap: 12px; justify-items: center; opacity: 0; }
#reveal.split .nw { animation: titleIn 1.4s .05s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes titleIn { from { opacity: 0; letter-spacing: .9em; filter: blur(10px); } to { opacity: 1; letter-spacing: normal; filter: none; } }
#reveal .nw b { font-family: var(--mincho); font-weight: 800; font-size: clamp(50px, 14vw, 140px); line-height: 1; letter-spacing: .16em; margin-right: -.16em; color: #fff; text-shadow: 0 0 40px rgba(200,50,60,.45); }
#reveal .nw b::after { content: ""; display: block; height: 3px; background: var(--stamp); margin: 16px auto 0; width: 70%; }
#reveal .nw i { font-style: normal; font-family: var(--mincho); font-weight: 800; font-size: clamp(18px, 4.4vw, 28px); letter-spacing: .5em; margin-right: -.5em; color: #E9EDF4; }
#reveal .nw em { font-style: normal; font-family: var(--mincho); font-size: clamp(13px, 3vw, 16px); letter-spacing: .3em; color: var(--mute); }
@media (prefers-reduced-motion: reduce) { #reveal .org, #reveal .nw { animation-duration: .01s !important; } #reveal.quake > * { animation: none !important; } }
/* 紹介中は画面を分ける：映像は左（スマホは上）、説明は右（スマホは下）に置き、重ねない */
body.withCard #stage { right: 400px; }
body.withCard #nameCard { top: 0; right: 0; bottom: 0; width: 400px; max-width: none; transform: none; background: #0E131E; border-left-width: 6px; padding: calc(env(safe-area-inset-top, 0px) + 64px) 22px 22px; overflow-y: auto; }
body.withCard #nameCard b { font-size: 30px; }
body.withCard #nameCard p { font-size: 13.5px; line-height: 1.85; }
body.withCard #dlg { left: calc((100% - 400px) / 2); width: min(calc(100vw - 432px), 760px); }

let last = performance.now();
function loop(now) { requestAnimationFrame(loop); const dt = Math.min(0.05, (now - last) / 1000); last = now; T.now += dt; bgmTick();
