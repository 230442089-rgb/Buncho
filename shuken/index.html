<style>

:root {

  --gold: #E3B428;     /* 陽盾の金（ユリアの色） */
  --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#stage canvas { display: block; width: 100%; height: 100%; transition: filter .5s; }
body.ura #stage canvas { filter: grayscale(.85) contrast(1.25) brightness(.7); }
#uraVeil { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 35%, rgba(90,0,10,.55) 100%); }
body.ura #uraVeil { opacity: 1; }
#layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); font-size: 11.5px; font-weight: 900; padding: 2px 8px; border-radius: 4px; background: rgba(18,24,38,.82); color: var(--ink); white-space: nowrap; border: 1px solid var(--line); }
.pop { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 14px; color: var(--ink); text-shadow: 0 1px 3px #000; white-space: nowrap; animation: rise 1.2s ease-out forwards; }
.pop.down { color: #FF8A92; } .pop.up { color: #9FE3C0; }
@keyframes rise { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: 0 -40px; } }

/* HUD */
#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }

/* 操作 */

/* 電話・字幕カード */
#phone { position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; background: rgba(6,8,14,.55); padding: 16px; }

#card { position: fixed; inset: 0; z-index: 20; background: #05070B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; opacity: 0; transition: opacity .7s; pointer-events: none; }

#note { position: fixed; inset: 0; z-index: 16; background: rgba(6,8,14,.7); display: flex; align-items: center; justify-content: center; padding: 16px; }

.nh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.ni { border-top: 1px solid #C8CDD6; padding-top: 8px; }

.chip { display: inline-block; font-size: 10px; font-weight: 900; padding: 1px 6px; margin-right: 6px; border: 1.5px solid var(--stamp); color: var(--stamp); vertical-align: 1px; letter-spacing: .1em; }

/* タイトル */
#title { position: fixed; inset: 0; z-index: 18; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 16px calc(env(safe-area-inset-bottom, 0px) + 28px); background: linear-gradient(to bottom, rgba(5,7,11,0) 0%, rgba(5,7,11,.15) 35%, rgba(5,7,11,.9) 80%); }
.tbox { width: 100%; max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }

.tbox .sub { font-family: var(--mincho); font-size: clamp(16px, 4vw, 22px); letter-spacing: .2em; }
.tbox .ch { display: flex; align-items: center; gap: 10px; font-family: var(--mincho); font-size: 15px; }
.tbox .ch span { border: 1.5px solid var(--stamp); color: var(--stamp); padding: 2px 8px; font-size: 12px; font-family: var(--body); font-weight: 900; letter-spacing: .1em; }
.tbox p { margin: 0; font-size: 13px; line-height: 1.8; color: #C9D0DE; max-width: 60ch; }
.trow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.go { border: 0; background: var(--paper); color: #141A28; font-family: var(--mincho); font-weight: 800; font-size: 18px; padding: 12px 28px; letter-spacing: .2em; }

.ghost { border: 1px solid var(--line); background: rgba(18,24,38,.6); padding: 9px 14px; font-size: 13px; font-weight: 700; }
.ghost[aria-pressed="true"] { border-color: var(--paper); }

/* 報告書 */
#report { position: fixed; inset: 0; z-index: 19; background: rgba(5,7,11,.92); display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
.doc { width: 100%; max-width: 600px; background: var(--paper); color: #141A28; padding: 22px 22px 20px; position: relative; display: grid; gap: 10px; margin: auto; }
.doc .stamps { position: absolute; right: 18px; top: 16px; display: flex; gap: 6px; }
.doc .stamps span { border: 3px solid var(--stamp); color: var(--stamp); font-family: var(--mincho); font-weight: 800; font-size: 18px; padding: 2px 8px; transform: rotate(-8deg); }
.doc h2 { margin: 0; font-family: var(--mincho); font-size: 22px; }
.doc .meta { font-size: 12px; color: #4A5468; }
.doc table { width: 100%; border-collapse: collapse; font-size: 13px; }
.doc td { color: #141A28; border-top: 1px solid #C8CDD6; padding: 6px 4px; vertical-align: top; line-height: 1.6; }
.doc td:first-child { white-space: nowrap; font-weight: 900; width: 7.5em; color: #2A3348; }

#loc { position: fixed; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px); z-index: 8; pointer-events: none; opacity: 0; transition: opacity .8s; max-width: calc(100vw - 32px); }
#loc.on { opacity: 1; }
#loc small { display: block; font-size: 11px; letter-spacing: .3em; color: var(--mute); font-weight: 900; }
#loc b { display: block; font-family: var(--mincho); font-weight: 800; font-size: clamp(20px, 4.4vw, 34px); letter-spacing: .1em; color: #fff; text-shadow: 0 2px 16px rgba(0,0,0,.7); }
#loc i { display: block; font-style: normal; font-size: 11px; letter-spacing: .24em; color: #C9D0DE; margin-top: 4px; }
#nameCard { position: fixed; right: 16px; top: 22%; z-index: 8; width: min(340px, calc(100vw - 32px)); background: rgba(10,13,22,.86); border-left: 5px solid var(--gold); padding: 12px 14px; pointer-events: none; opacity: 0; transform: translateX(12px); transition: opacity .4s, transform .4s; }

#skipBtn { position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 14px); z-index: 21; border: 1px solid var(--line); background: rgba(10,13,22,.8); padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--mute); }
/* 紹介中は画面を分ける：映像は左（スマホは上）、説明は右（スマホは下）に置き、重ねない */
body.withCard #stage { right: 400px; }
body.withCard #nameCard { top: 0; right: 0; bottom: 0; width: 400px; max-width: none; transform: none; background: #0E131E; border-left-width: 6px; padding: calc(env(safe-area-inset-top, 0px) + 64px) 22px 22px; overflow-y: auto; }

<script>
(() => { 'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center;font-weight:700;background:#121826;z-index:99">3Dの部品を読み込めませんでした。通信を確かめて、もう一度開いてください。</div>'); return; }
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.random() * a.length | 0], clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ================= レンダラ =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
