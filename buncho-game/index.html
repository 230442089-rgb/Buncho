<title>文鳥 vs ユリア</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* One committed look: a night-purple frame around a bright game screen. */
  :root {
    color-scheme: dark;
    --bg: #251E3B;
    --bg-glow: #3B2E63;
    --fg: #FFF6FB;
    --muted: #BDB2DD;
    --accent: #FF7FA6;
    --accent-ink: #3D1A2A;
    --gold: #F2C14E;
    --line: rgba(255, 255, 255, .14);
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, var(--bg-glow), var(--bg) 70%) fixed, var(--bg);
    color: var(--fg);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    box-sizing: border-box;
    height: 100vh; height: 100dvh;
    padding-top: max(10px, env(safe-area-inset-top));
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    display: flex; flex-direction: column; gap: 8px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #stage {
    position: relative; width: 320px; height: 568px;
    border-radius: 22px; overflow: hidden;
    background: #CFE8FF;
    box-shadow: 0 0 0 2px var(--line), 0 18px 50px rgba(0, 0, 0, .45);
  }
  #game {
    display: block; width: 100%; height: 100%;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    cursor: pointer;
  }
  #game:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
  .loading {
    position: absolute; inset: auto 0 46% 0; text-align: center;
    font-weight: 900; font-size: 15px; color: #3D3456; pointer-events: none;
  }
  #stage.ready .loading { display: none; }
  .bar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px;
    min-height: 40px; font-size: 11px; color: var(--muted); text-align: center;
  }
  #mute {
    flex: 0 0 auto; min-width: 92px; min-height: 36px; padding: 0 14px;
    border-radius: 999px; border: 2px solid var(--accent);
    background: transparent; color: var(--fg);
    font: 900 14px/1 inherit; font-family: inherit; cursor: pointer;
  }
  #mute[aria-pressed="true"] { border-color: var(--muted); color: var(--muted); }
  #mute:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .credit { max-width: 300px; line-height: 1.45; }
  @media (max-width: 380px) { .credit { display: none; } }
</style>

<div class="wrap">
  <div id="stage">
    <canvas id="game" tabindex="0" role="application" aria-label="文鳥 vs ユリア。ドラッグか矢印キーで移動、タップかスペースキーでつつく"></canvas>
    <div class="loading">よみこみ中…</div>
  </div>
</div>
<div class="bar">
  <button id="mute" type="button" aria-pressed="false">音：オン</button>
  <span class="credit">BGM: Kevin MacLeod / Bryan Teoh (FreePD, CC0)<br>効果音: Wyzowl SFX Kit (CC0)</span>
</div>

<script src="util.js"></script>
<script src="chars.js"></script>
<script src="game.js"></script>
